<title>KJME Margin Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an editor's desk. Decisions first, as a one-at-a-time review with the options set as
   finished verses; the full text second, as a reading column with its margin beside it. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --raised: #fafbfc; --ink: #15171c; --muted: #575d69; --faint: #858b96; --line: #dfe2e8; --line-strong: #c9ced7;
  --rubric: #a1202a; --rubric-soft: #f9e8e9; --rubric-ink: #7d1820;
  --edit: #fbebbc; --edit-ink: #4f3a00; --mech: #e8ebf0; --del: #b0414a;
  --cat-shifted: #b25205; --cat-archaic: #1c5ea6; --cat-syntax: #6a3cad; --cat-spelling: #0e7268; --cat-other: #575d69;
  --ok: #1d7748; --ok-soft: #e2f2e9; --warn: #8f5500; --warn-soft: #fbf0db;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #1a1d22; --raised: #1f2329; --ink: #e9ebef; --muted: #a5abb6; --faint: #757c88; --line: #2b2f37; --line-strong: #3a3f49;
  --rubric: #ee8088; --rubric-soft: #3b1d21; --rubric-ink: #f6b3b8;
  --edit: #4b3a0e; --edit-ink: #f7dd94; --mech: #262a31; --del: #f08e95;
  --cat-shifted: #f2a45d; --cat-archaic: #80b3f0; --cat-syntax: #ba9bf1; --cat-spelling: #60d1c3; --cat-other: #a5abb6;
  --ok: #70d4a0; --ok-soft: #163225; --warn: #f2be65; --warn-soft: #392b12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d22; --raised: #1f2329; --ink: #e9ebef; --muted: #a5abb6; --faint: #757c88; --line: #2b2f37; --line-strong: #3a3f49;
  --rubric: #ee8088; --rubric-soft: #3b1d21; --rubric-ink: #f6b3b8;
  --edit: #4b3a0e; --edit-ink: #f7dd94; --mech: #262a31; --del: #f08e95;
  --cat-shifted: #f2a45d; --cat-archaic: #80b3f0; --cat-syntax: #ba9bf1; --cat-spelling: #60d1c3; --cat-other: #a5abb6;
  --ok: #70d4a0; --ok-soft: #163225; --warn: #f2be65; --warn-soft: #392b12; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans) }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button, input { font: inherit; color: inherit }
button { cursor: pointer }
button:disabled { cursor: default; opacity: .45 }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px }
a { color: var(--rubric) }
.mono { font-family: var(--mono); font-size: 12.5px }
h1, h2, h3 { text-wrap: balance }

/* ---------- masthead ---------- */
.mast { padding-block: 22px 0; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; justify-content: space-between }
.brand { display: flex; gap: 14px; align-items: center; min-width: 0 }
.seal { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 9px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 600 15px/1 var(--serif); letter-spacing: .02em }
.brand h1 { font: 600 24px/1.15 var(--serif); margin: 0 }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px }
.verify { display: inline-flex; gap: 6px; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; vertical-align: 1px }
.verify.ok { background: var(--ok-soft); color: var(--ok) } .verify.bad { background: var(--warn-soft); color: var(--warn) }
.stats { display: flex; flex-wrap: wrap; gap: 6px 24px; font-variant-numeric: tabular-nums }
.stat b { display: block; font: 600 19px/1.1 var(--sans) }
.stat span { color: var(--faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em }

/* ---------- navigation ---------- */
nav.tabsbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 16px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none }
.tabs button { border: 0; background: none; padding: 12px 12px 11px; min-height: 44px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink) }
.count { font: 600 11.5px/1 var(--sans); padding: 3px 7px; border-radius: 999px; background: var(--mech); color: var(--muted) }
.count.hot { background: var(--rubric); color: var(--surface) }
@media (max-width: 760px) { nav.tabsbar { position: static } }

main { padding-block: 24px 80px }
.pill { font: 500 11.5px/1 var(--sans); padding: 4px 8px; border-radius: 999px; background: var(--mech); color: var(--muted); white-space: nowrap }
.pill.red { background: var(--rubric-soft); color: var(--rubric) } .pill.rec { background: none; border: 1px solid var(--ink); color: var(--ink) } .pill.green { background: var(--ok-soft); color: var(--ok) } .pill.amber { background: var(--warn-soft); color: var(--warn) }
.empty { color: var(--muted) }
.eyebrow { font: 600 11.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint) }

/* ---------- decisions ---------- */
.desk { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; align-items: start }
@media (max-width: 900px) { .desk { grid-template-columns: minmax(0, 1fr) } }
.queue { position: sticky; top: calc(var(--navh, 45px) + 16px); display: flex; flex-direction: column; gap: 12px }
@media (max-width: 900px) { .queue { position: static } }
.progress { display: flex; flex-direction: column; gap: 6px }
.progress .track { height: 6px; border-radius: 3px; background: var(--mech); overflow: hidden }
.progress .fill { display: block; height: 100%; background: var(--ink); transition: width .2s }
.progress .txt { font-size: 13px; color: var(--muted) }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.qitem { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 10px }
.qitem[aria-current="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink) }
.qitem .mark { grid-row: 1 / 3; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font: 600 11px/1 var(--sans); margin-top: 1px }
.qitem.done .mark { background: var(--ink); border-color: var(--ink); color: var(--surface) }
.qitem .p { font-weight: 600; font-size: 13.5px }
.qitem .s { color: var(--muted); font-size: 12.5px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.qlist-mobile { display: none } .out.out-mobile { display: none }
@media (max-width: 900px) { .out.out-desk { display: none } .out.out-mobile { display: flex } }
@media (max-width: 900px) { .qlist { display: none } .qlist-mobile { display: flex; gap: 8px; align-items: center; justify-content: space-between } }
.out { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px }
.out .btns { display: flex; flex-wrap: wrap; gap: 6px }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 40px; font-weight: 500 }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface) }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px }

.decision { display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.decision h2 { font: 600 30px/1.2 var(--serif); margin: 6px 0 0; letter-spacing: -.01em }
@media (max-width: 560px) { .decision h2 { font-size: 24px } }
.lede { font-size: 16px; line-height: 1.65; color: var(--ink); max-width: 68ch; margin: 0 }
.callout { border-radius: var(--r); padding: 12px 14px; font-size: 14px; line-height: 1.55; max-width: 72ch }
.callout.amber { background: var(--warn-soft); color: var(--ink) } .callout.amber b { color: var(--warn) }
.callout.plain { background: var(--surface); border: 1px dashed var(--line-strong) }

.options { display: flex; flex-direction: column; gap: 14px }
.opt { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0 }
.opt.chosen { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) }
.opt-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 14px 16px 0 }
.letter { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px; background: var(--mech); display: grid; place-items: center; font: 600 15px/1 var(--serif) }
.opt.chosen .letter { background: var(--ink); color: var(--surface) }
.opt-title { font: 600 16px/1.35 var(--sans); flex: 1 1 260px; min-width: 0 }
.opt-title .arrow { color: var(--faint); font-weight: 400 }
.opt-title s { color: var(--muted); text-decoration-thickness: 1.5px }
.opt-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px }
.reads { display: flex; flex-direction: column; gap: 10px }
.reads .lbl { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin-bottom: 5px; display: block }
.reads .vrow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px }
.reads .vref { font: 500 12px/2.4 var(--sans); color: var(--faint); text-align: right; font-variant-numeric: tabular-nums }
.reads .verse-text { font: 400 19px/1.65 var(--serif); border-left: 3px solid var(--line); padding: 2px 0 2px 14px }
.rec-why { font-size: 13.5px; color: var(--ink); margin: 0; padding: 8px 10px; background: var(--raised); border-radius: 6px }
.opt.chosen .reads .verse-text { border-left-color: var(--ink) }
.also { font-size: 13.5px; color: var(--muted); margin: 0 }
.also b { color: var(--ink); font-weight: 500 }
.flag { font-size: 13.5px; line-height: 1.5 }
.flag summary { cursor: pointer; color: var(--rubric); font-weight: 500; min-height: 30px; display: flex; align-items: center; gap: 6px }
.flag ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 6px }
.opt-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--raised) }
.opt-foot .who { font-size: 13px; color: var(--muted) }
.choose { min-height: 42px; padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--surface); font-weight: 600 }
.opt.chosen .choose { background: var(--ink); border-color: var(--ink); color: var(--surface) }
.dnav { display: flex; justify-content: space-between; gap: 10px; padding-top: 6px }
.tech summary { cursor: pointer; color: var(--faint); font-size: 13px; min-height: 30px; display: flex; align-items: center }
.tech p { font-size: 13px; color: var(--muted); margin: 6px 0 0 }

/* ---------- shared text marks ---------- */
.it { font-style: italic }
.chg, .ins.edit, .ins { background: var(--edit); color: var(--edit-ink); border-radius: 3px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone }
.del { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; margin-right: 4px; font-size: .9em }
.ins.mech { background: none; color: inherit; padding: 0; border-bottom: 1.5px dotted var(--faint); border-radius: 0 }
.del.mech { opacity: .65 }
.chg-k { text-decoration: underline dotted var(--muted); text-decoration-thickness: 1.5px; text-underline-offset: 4px }
.show-mech .mech, .show-mech .mech-k { background: var(--mech); border-radius: 3px }
sup.pl { font: 600 9.5px/1 var(--sans); color: var(--muted); margin-left: 1px; letter-spacing: .02em }
.flash { outline: 2px solid var(--ink); outline-offset: 1px; border-radius: 3px }

/* ---------- text ---------- */
.tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 7px 12px; min-height: 38px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--muted); min-height: 34px; display: inline-flex; gap: 6px; align-items: center }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 500 }
@media (max-width: 760px) { .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100% } .chip { flex: 0 0 auto } }
.search { flex: 1 1 200px; min-width: 0; max-width: 300px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 11px; min-height: 38px }
@media (max-width: 760px) { .search { max-width: none } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; margin-bottom: 6px }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 410px); gap: 28px; align-items: start }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr) } .margin-col { display: none } }
.chapnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px }
.chapnav a { text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font-size: 13px; background: var(--surface) }
h2.chapter { font: 600 12.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .13em; color: var(--muted); margin: 26px 0 8px; scroll-margin-top: calc(var(--navh, 45px) + 16px) }
.verse { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 8px; padding: 9px 10px 9px 4px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer; scroll-margin-top: calc(var(--navh, 45px) + 16px) }
.verse:hover { background: var(--surface) }
.verse.sel { background: var(--surface); border-color: var(--line-strong) }
.verse.waiting { position: relative }
.verse.waiting::before { content: ""; position: absolute; left: -8px; top: 0; bottom: 0; width: 2px; background: var(--rubric) }
.vmeta { align-items: center }
.vnum { font: 500 12px/2.25 var(--sans); color: var(--faint); text-align: right; font-variant-numeric: tabular-nums }
.vtext { font: 400 18px/1.7 var(--serif); min-width: 0 }
.vmeta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px }
.parallel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px }
.parallel .k { color: var(--muted) }
.parallel .lbl { font: 600 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); display: block; margin-bottom: 4px }
@media (max-width: 560px) { .parallel { grid-template-columns: minmax(0, 1fr) } }

.margin-col { position: sticky; top: calc(var(--navh, 45px) + 16px); max-height: calc(100vh - var(--navh, 45px) - 32px); overflow-y: auto; overscroll-behavior: contain }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.inline-panel { grid-column: 1 / -1; margin: 8px 0 4px; cursor: default }
.panel h3 { font: 600 20px/1.2 var(--serif); margin: 0 }
.panel h4 { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin: 0 0 8px }
.phead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
.sub { color: var(--muted); font-size: 13px; margin-top: 3px }
.navbtns { display: flex; gap: 6px }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; min-width: 36px; min-height: 36px; color: var(--muted) }
.chlist { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none }
.ch { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; cursor: pointer }
.ch .words { font: 400 16px/1.4 var(--serif) } .ch .words s { color: var(--muted) }
.ch .why { color: var(--muted); font-size: 13.5px }
.cat { font: 600 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .09em; color: var(--c, var(--cat-other)); display: inline-flex; gap: 6px; align-items: center }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--cat-other)); display: inline-block }
.cat-shifted_meaning { --c: var(--cat-shifted) } .cat-archaic_word { --c: var(--cat-archaic) } .cat-syntax { --c: var(--cat-syntax) } .cat-spelling { --c: var(--cat-spelling) }
.gl { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px }
details.more { font-size: 13.5px }
details.more summary { cursor: pointer; color: var(--muted); min-height: 30px; display: flex; align-items: center }
details.more .ev { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13.5px; margin: 0 }
.kv dt { color: var(--faint) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.rationale { font-size: 14px; line-height: 1.6; background: var(--bg); padding: 10px 12px; border-radius: 6px; margin: 8px 0 0 }
.cand { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px }
.cand.win { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok) }
.cand .who { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px }
.cand .txt { font: 400 15.5px/1.55 var(--serif) }
.cands { display: flex; flex-direction: column; gap: 8px }
.gate { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 4px; background: var(--ok-soft); color: var(--ok) }
.gate.fail { background: var(--rubric-soft); color: var(--rubric) }
.note { font-size: 13px; color: var(--muted); margin: 0; padding-left: 10px; border-left: 2px solid var(--line) }
.pending-box { background: var(--rubric-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px }
.pending-box .q { font: 500 15px/1.5 var(--sans); color: var(--rubric-ink) }

/* ---------- glossary and run ---------- */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--faint) }
td.serif { font: 400 15px/1.4 var(--serif) }
.st { font: 500 11.5px/1 var(--sans); padding: 3px 7px; border-radius: 999px; background: var(--mech); color: var(--muted) }
.st.ratified { background: var(--ok-soft); color: var(--ok) } .st.provisional { background: var(--warn-soft); color: var(--warn) }
.cards { display: flex; flex-direction: column; gap: 16px; max-width: 900px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.card h3 { margin: 0; font: 600 19px/1.25 var(--serif) }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px }
.bars { display: flex; flex-direction: column; gap: 8px }
.barrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 30px; gap: 10px; align-items: center; font-size: 13.5px; font-variant-numeric: tabular-nums }
.barrow .track { height: 10px; background: var(--mech); border-radius: 5px; overflow: hidden }
.barrow .fill { display: block; height: 100%; background: var(--rubric) }
footer { color: var(--faint); font-size: 12.5px; padding-block: 24px; border-top: 1px solid var(--line) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
</style>

<header class="wrap mast">
  <div class="brand">
    <div class="seal" aria-hidden="true">KJ</div>
    <div><h1>King James Margin Edition</h1><p id="subtitle"></p></div>
  </div>
</header>
<nav class="tabsbar" aria-label="Sections"><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></nav>

<main class="wrap">
  <section id="tab-decisions" role="tabpanel" hidden></section>
  <section id="tab-text" role="tabpanel" hidden>
    <div class="tools">
      <div class="seg" aria-label="Text view" id="views"></div>
      <div class="chips" aria-label="Show" id="filters"></div>
      <input class="search" id="q" type="search" placeholder="Find a word or reference" aria-label="Find a word or reference">
    </div>
    <div class="layout">
      <div id="textcol">
        <div class="legend" id="legend"></div>
        <nav class="chapnav" id="chapnav" aria-label="Chapters"></nav>
        <div id="verses"></div>
      </div>
      <aside class="margin-col" aria-label="Margin" id="margincol"></aside>
    </div>
  </section>
  <section id="tab-glossary" role="tabpanel" hidden>
    <div class="tools"><div class="chips" id="glfilters"></div><input class="search" id="gq" type="search" placeholder="Find a word" aria-label="Find a glossary word"></div>
    <div class="tablewrap"><table id="gltable"></table></div>
  </section>
  <section id="tab-run" role="tabpanel" hidden><div id="runinfo" class="cards"></div></section>
</main>
<footer class="wrap" id="foot"></footer>

<script>
const DATA = /*__KJME_DATA__*/null;
(function () {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const store = {
    get(k, d) { try { const v = localStorage.getItem("kjme:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("kjme:" + k, JSON.stringify(v)); } catch {} },
  };
  if (!DATA) { document.body.insertAdjacentHTML("beforeend", "<p class='wrap'>No run data was embedded in this page.</p>"); return; }

  const R = DATA.run;
  const D = (DATA.decisions || []).filter((d) => d.status === "open");
  const byId = new Map(DATA.verses.map((v) => [v.id, v]));
  const order = DATA.verses.map((v) => v.id);
  const gl = new Map(DATA.glossary.map((g) => [g.id, g]));
  const CAT = { shifted_meaning: "Shifted meaning", archaic_word: "Archaic word", syntax: "Syntax", spelling: "Spelling", punctuation: "Punctuation", verb_form: "Verb form", pronoun_sg: "Pronoun", pronoun_pl: "Pronoun" };
  const NAME = { "translator-minimalist": "Minimalist", "translator-clarity": "Clarity", "translator-cadence": "Cadence", mechanical: "KJV with routine updates only", coordinator: "Coordinator", "reviewer-scorer": "Scorer", "reviewer-meaning-auditor": "Auditor" };
  const who = (a) => NAME[a] || a;
  const choicesKey = "choices:" + R.id;
  const choices = store.get(choicesKey, {});
  const state = { tab: D.length ? "decisions" : "text", di: 0, view: store.get("view", "read"), filter: "all", cats: new Set(), q: "", gq: "", sel: null, mech: store.get("mech", false), glf: "all" };
  const L = (i) => String.fromCharCode(65 + i);
  const ref = (vid) => { const v = byId.get(vid); return v ? `${v.ch}:${v.v}` : vid; };

  // ---------- masthead ----------
  const verified = R.verification.issues.length === 0;
  $("#subtitle").innerHTML = `${esc(DATA.book)} pilot · run <span class="mono">${esc(R.id)}</span> · ` +
    `<span class="verify ${verified ? "ok" : "bad"}" title="Every displayed verse was rebuilt from the data and checked against the KJV and the accepted text.">${verified ? `${R.verification.checked} of ${R.verification.checked} verses verified` : `${R.verification.issues.length} display issues`}</span>`;
  const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  void stat;

  const tabs = [["decisions", "Your decisions"], ["text", "Text"], ["glossary", "Glossary"], ["run", "Run"]];
  function renderTabs() {
    const left = D.filter((d) => !choices[d.batch]).length;
    $("#tabs").innerHTML = tabs.map(([k, l]) => {
      const n = k === "decisions" ? (D.length ? `<span class="count${left ? " hot" : ""}">${left ? left + " left" : "done"}</span>` : "") : k === "glossary" ? `<span class="count">${DATA.glossary.length}</span>` : "";
      return `<button role="tab" id="t-${k}" aria-controls="tab-${k}" aria-selected="${state.tab === k}" data-tab="${k}">${l}${n}</button>`;
    }).join("");
    for (const [k] of tabs) $("#tab-" + k).hidden = k !== state.tab;
  }

  function runsHtml(runs) {
    return runs.map((r) => {
      if (r.m) return r.m === "pl" ? `<sup class="pl">pl</sup>` : "";
      const t = esc(r.t);
      return r.c || r.k ? `<span class="${esc(r.c || "")}"${r.k ? ` data-k="${esc(r.k)}"` : ""}>${t}</span>` : t;
    }).join("");
  }
  function copy(btn, text) {
    const done = () => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = o), 1400); };
    try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, btn)); } catch { fallbackCopy(text, btn); }
  }
  function fallbackCopy(text, btn) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.width = "100%"; ta.rows = 6; ta.setAttribute("aria-label", "Text to copy");
    btn.closest(".out, .opt-foot, .panel")?.appendChild(ta); ta.select();
  }

  // ---------- decisions ----------
  function optLabel(o) {
    if (o.keeps_kjv) return `Keep the KJV wording${o.focus_changes.length === 0 && o.other_changes.length ? " here" : ""}`;
    return o.focus_changes.map((c) => `<s>${esc(c.from) || "∅"}</s> <span class="arrow">→</span> ${esc(c.to) || "∅"}`).join("<span class='arrow'>; </span>");
  }
  function optPlain(o) {
    if (o.keeps_kjv) return "Keep the KJV wording";
    return o.focus_changes.map((c) => `${c.from || "(nothing)"} → ${c.to || "(removed)"}`).join("; ");
  }
  function reviewPill(o) {
    if (o.review_fails.length) return `<span class="pill red">Flagged by ${o.review_fails.map((r) => (r === "auditor" ? "the auditor" : "the scorer")).join(" and ")}</span>`;
    if (o.failed_checks) return `<span class="pill red">Breaks a glossary or text rule</span>`;
    return `<span class="pill green">Passed both reviewers</span>`;
  }
  function messageText() {
    const lines = D.map((d) => {
      const c = choices[d.batch];
      if (!c) return `- ${d.passage}: not decided yet`;
      const i = d.options.findIndex((o) => o.choose === c);
      return i < 0 ? `- ${d.passage}: ${c}` : `- ${d.passage}: option ${L(i)}, ${optPlain(d.options[i])} (${c})`;
    });
    return `KJME decisions for run ${R.id}:\n${lines.join("\n")}`;
  }
  function commandsText() {
    return D.filter((d) => choices[d.batch]).map((d) => `npx tsx src/cli.ts resolve --run ${R.id} --batch ${d.batch} --select ${choices[d.batch]}`).join("\n");
  }

  function sendBox(done, cls) {
    if (!done) return "";
    return `<div class="out ${cls}"${done === D.length ? ' style="border-color:var(--ink)"' : ""}><b>Send your choices</b><span class="sub" style="margin:0">${done === D.length ? "All decided. Copy them as a message to paste into the chat." : `${done} of ${D.length} chosen. You can send them now or when all are done.`} Choices stay in this browser until you send them.</span>
      <div class="btns"><button class="btn small primary" data-copy-msg ${done ? "" : "disabled"}>Copy as message</button><button class="btn small" data-copy-cmd ${done ? "" : "disabled"}>Copy commands</button>${done ? `<button class="btn small" data-clear>Clear</button>` : ""}</div></div>`;
  }
  function renderDecisions() {
    const host = $("#tab-decisions");
    if (!D.length) { host.innerHTML = `<p class="empty">Nothing is waiting for you. Every passage in this run has been decided.</p>`; return; }
    state.di = Math.max(0, Math.min(state.di, D.length - 1));
    const d = D[state.di];
    const done = D.filter((x) => choices[x.batch]).length;
    const allFlagged = d.options.every((o) => o.review_fails.length || o.failed_checks);

    const queue = `<aside class="queue" aria-label="Decisions">
      <div class="progress"><span class="txt"><b>${done} of ${D.length}</b> decided</span><span class="track"><span class="fill" style="width:${(done / D.length) * 100}%"></span></span></div>
      <ul class="qlist">${D.map((x, i) => {
        const c = choices[x.batch];
        const oi = c ? x.options.findIndex((o) => o.choose === c) : -1;
        return `<li><button class="qitem${c ? " done" : ""}" data-di="${i}" aria-current="${i === state.di}"><span class="mark">${c ? (oi >= 0 ? L(oi) : "✓") : ""}</span><span class="p">${esc(x.passage)}</span><span class="s">${esc(x.question)}</span></button></li>`;
      }).join("")}</ul>
      <div class="qlist-mobile"><button class="btn small" data-di="${state.di - 1}" ${state.di === 0 ? "disabled" : ""}>Previous</button><span class="sub">Decision ${state.di + 1} of ${D.length}</span><button class="btn small" data-di="${state.di + 1}" ${state.di === D.length - 1 ? "disabled" : ""}>Next</button></div>
      ${sendBox(done, "out-desk")}
    </aside>`;

    const opts = d.options.map((o, i) => {
      const chosen = choices[d.batch] === o.choose;
      const reads = d.focus_verses.map((vid) => `<div class="vrow"><span class="vref">${ref(vid)}</span><div class="verse-text">${runsHtml(o.verses[vid].runs)}</div></div>`).join("");
      const also = o.other_changes.length ? `<p class="also"><b>This option also changes, elsewhere in ${esc(d.passage.replace(DATA.book + " ", ""))}:</b> ${o.other_changes.map((c) => `${ref(c.verse)} ${esc(c.from) || "∅"} → ${esc(c.to) || "∅"}`).join("; ")}</p>` : "";
      const flags = o.fail_notes.length ? `<details class="flag"><summary>Why the reviewers flagged it</summary><ul>${o.fail_notes.map((f) => `<li><b>${f.reviewer === "auditor" ? "Auditor" : "Scorer"}:</b> ${esc(f.note)}</li>`).join("")}</ul></details>` : "";
      return `<article class="opt${chosen ? " chosen" : ""}" aria-label="Option ${L(i)}">
        <div class="opt-head"><span class="letter">${L(i)}</span><span class="opt-title">${optLabel(o)}</span>${o.recommended ? `<span class="pill rec">Recommended</span>` : ""}${reviewPill(o)}</div>
        <div class="opt-body"><div class="reads" aria-label="How the verse would read">${reads}</div>${also}${o.recommended && d.why ? `<p class="rec-why"><b>Why it is recommended:</b> ${esc(d.why)}</p>` : ""}${flags}</div>
        <div class="opt-foot"><span class="who">${o.authors.every((a) => a === "mechanical") ? "The KJV with routine updates only" : "Proposed by " + o.authors.filter((a) => a !== "mechanical").map(who).join(", ")}</span><button class="choose" data-choose="${esc(o.choose)}" data-batch="${esc(d.batch)}" aria-pressed="${chosen}">${chosen ? "Chosen ✓" : "Choose " + L(i)}</button></div>
      </article>`;
    }).join("");

    host.innerHTML = `<div class="desk">${queue}<div class="decision">
      <div><span class="eyebrow">${esc(d.passage)}</span><h2>${esc(d.question)}</h2></div>
      ${d.context ? `<p class="lede">${esc(d.context)}</p>` : ""}
      ${allFlagged ? `<div class="callout amber"><b>Every option has an objection.</b> Choose the one that does the least harm, or ask for a re-run (below the options).</div>` : ""}
      <div class="options">${opts}</div>
      ${d.rerun ? `<div class="callout plain"><b>None of these?</b> ${esc(d.rerun)}</div>` : ""}
      <details class="tech"><summary>The coordinator's technical question</summary><p>${esc(d.technical)}</p></details>
      ${sendBox(done, "out-mobile")}
      <div class="dnav"><button class="btn" data-di="${state.di - 1}" ${state.di === 0 ? "disabled" : ""}>Previous</button><button class="btn" data-open-text="${esc(d.focus_verses[0])}">See it in the text</button><button class="btn primary" data-di="${state.di + 1}" ${state.di === D.length - 1 ? "disabled" : ""}>Next decision</button></div>
    </div></div>`;
  }

  // ---------- text ----------
  const views = [["read", "Read"], ["diff", "Diff"], ["parallel", "Side by side"]];
  $("#views").innerHTML = views.map(([k, l]) => `<button data-view="${k}">${l}</button>`).join("");
  const usedCats = [...new Set(DATA.verses.flatMap((v) => v.changes.filter((c) => !c.auto && !/^pronoun_|^verb_form$/.test(c.category)).map((c) => c.category)))];
  $("#filters").innerHTML = `<span class="seg" aria-label="Show">${[["all", "All"], ["changed", "Changed"], ["pending", "Waiting"]].map(([k, l]) => `<button data-filter="${k}">${l}</button>`).join("")}</span>` +
    `<label class="sub" style="display:inline-flex;gap:8px;align-items:center;margin:0">Type <select id="catsel" class="search" style="min-width:150px;max-width:200px;flex:0 0 auto"><option value="">All types</option>${usedCats.map((c) => `<option value="${c}">${CAT[c] || c}</option>`).join("")}</select></label>`;
  $("#legend").innerHTML = `<span><span class="chg">word</span> changed</span><span><span class="del">word</span> KJV word replaced (Diff)</span><span>you<sup class="pl">pl</sup> plural "you"</span><span><span class="it">italic</span> supplied word</span><span><label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="mechbtn"> show routine updates</label></span>`;
  $("#chapnav").innerHTML = DATA.chapters.map((c) => `<a href="#ch-${c}" data-ch="${c}">Chapter ${c}</a>`).join("");

  function syncText() {
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    document.querySelectorAll("[data-filter]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter)));
    $("#catsel").value = [...state.cats][0] || "";
    $("#mechbtn").checked = state.mech;
    document.body.classList.toggle("show-mech", state.mech);
  }
  function visible(v) {
    if (state.filter === "changed" && !v.changes.some((c) => !c.auto)) return false;
    if (state.filter === "pending" && v.status === "accepted") return false;
    if (state.cats.size && !v.changes.some((c) => !c.auto && state.cats.has(c.category))) return false;
    if (state.q) {
      const q = state.q.toLowerCase(), plain = (rs) => rs.filter((r) => !r.m).map((r) => r.t).join("").toLowerCase();
      if (!(v.ref.toLowerCase().includes(q) || `${v.ch}:${v.v}` === q || plain(v.runs.read).includes(q) || plain(v.runs.kjv).includes(q))) return false;
    }
    return true;
  }
  function decisionFor(vid) { return D.findIndex((d) => d.verses.includes(vid) || DATA.batches[d.batch]?.verses.includes(vid)); }
  function verseHtml(v) {
    const n = v.changes.filter((c) => !c.auto).length;
    const b = DATA.batches[v.batch];
    const human = b?.decision?.decided_by && b.decision.decided_by !== "coordinator";
    const body = state.view === "parallel" ? `<div class="parallel"><div class="k"><span class="lbl">KJV 1769</span>${runsHtml(v.runs.kjv)}</div><div><span class="lbl">KJME</span>${runsHtml(v.runs.read)}</div></div>` : runsHtml(state.view === "diff" ? v.runs.inline : v.runs.read);
    const di = v.status !== "accepted" ? decisionFor(v.id) : -1;
    const firstOfPassage = di >= 0 && b?.verses?.[0] === v.id;
    void n;
    const pills = [firstOfPassage ? `<span class="pill red">Waiting for your decision: ${esc(D[di].passage.replace(DATA.book + " ", ""))}</span><button class="btn small" data-goto-decision="${di}">Decide</button>` : "",
      human ? `<span class="pill green">Decided by ${esc(b.decision.decided_by)}</span>` : "", v.issues.length ? `<span class="pill amber">Display issue</span>` : ""].join("");
    return `<div class="verse${state.sel === v.id ? " sel" : ""}${v.status !== "accepted" ? " waiting" : ""}" id="v-${v.id.replace(/\./g, "-")}" data-id="${v.id}" tabindex="0" role="button" aria-label="${esc(v.ref)}"><div class="vnum">${v.v}</div><div class="vtext">${body}</div>${pills ? `<div class="vmeta">${pills}</div>` : ""}</div>`;
  }
  function renderText() {
    syncText();
    let shown = 0;
    const out = DATA.chapters.map((ch) => {
      const vs = DATA.verses.filter((v) => v.ch === ch && visible(v));
      shown += vs.length;
      return `<h2 class="chapter" id="ch-${ch}">${esc(DATA.book)} ${ch}</h2>` + (vs.length ? vs.map(verseHtml).join("") : `<p class="empty">No verses in this chapter match.</p>`);
    }).join("");
    $("#verses").innerHTML = shown ? out : `<p class="empty">No verses match. Clear the filters or the search to see the text.</p>`;
    placePanel();
  }
  const narrow = () => window.matchMedia("(max-width: 920px)").matches;
  function placePanel() {
    document.querySelectorAll(".inline-panel").forEach((n) => n.remove());
    const html = state.sel && byId.get(state.sel) ? panelHtml(byId.get(state.sel)) :
      `<div class="empty"><h3 style="margin-bottom:8px">The margin</h3>Select a verse to see why each word changed, what each translator proposed, how the reviewers judged it, and who decided.</div>`;
    if (narrow()) {
      $("#margincol").innerHTML = "";
      const row = state.sel && document.getElementById("v-" + state.sel.replace(/\./g, "-"));
      if (row) row.insertAdjacentHTML("afterend", `<div class="panel inline-panel">${html}</div>`);
    } else $("#margincol").innerHTML = `<div class="panel">${html}</div>`;
  }
  function gates(c, b) {
    return b.reviews.map((r) => {
      const x = r.candidates[c.id];
      if (!x) return "";
      const g = ["G1", "G2"].map((k) => `<span class="gate${x.gates[k] === "fail" ? " fail" : ""}">${k === "G1" ? "meaning" : "number"} ${x.gates[k] === "fail" ? "✗" : "✓"}</span>`).join(" ");
      return `<span>${who(r.reviewer)}: ${g}</span>`;
    }).join(" ");
  }
  function panelHtml(v) {
    const b = DATA.batches[v.batch], d = b?.decision;
    const committee = v.changes.filter((c) => !c.auto), mech = v.changes.filter((c) => c.auto);
    const i = order.indexOf(v.id), di = decisionFor(v.id);
    const parts = [`<div class="phead"><div><h3>${esc(v.ref)}</h3><div class="sub">${v.status === "accepted" ? "Accepted" : "Waiting for your decision"}</div></div>` +
      `<div class="navbtns"><button class="iconbtn" data-go="${order[i - 1] || ""}" ${i <= 0 ? "disabled" : ""} aria-label="Previous verse">↑</button><button class="iconbtn" data-go="${order[i + 1] || ""}" ${i >= order.length - 1 ? "disabled" : ""} aria-label="Next verse">↓</button></div></div>`];
    if (v.issues.length) parts.push(`<div class="callout amber"><b>Display issues</b><ul>${v.issues.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`);
    if (di >= 0) parts.push(`<div class="pending-box"><div class="q">${esc(D[di].question)}</div><span class="sub" style="margin:0">The text shown is the coordinator's recommendation until you decide.</span><button class="btn small primary" data-goto-decision="${di}">Decide this passage</button></div>`);
    parts.push(`<div><h4>What changed</h4>` + (committee.length ? `<ul class="chlist">${committee.map((c) => {
      const g = c.glossary_id && gl.get(c.glossary_id);
      const ev = (c.evidence || []).map((e) => { const l = DATA.lookups[e.lookup_id];
        return `<details class="more"><summary>Evidence${l ? `: ${esc(l.query?.function || "lookup")} by ${esc(who(l.agent))}` : e.lookup_id.startsWith("pre:") ? ": Greek for this verse" : ""}</summary><div class="ev">${esc(e.note || "")}${l ? "\n\n" + esc(l.summary) : ""}</div></details>`; }).join("");
      return `<li class="ch" data-k="${esc(c.id)}"><span class="cat cat-${c.category}"><span class="dot"></span>${CAT[c.category] || esc(c.category)}</span><div class="words"><s>${esc(c.kjv) || "∅"}</s> → ${esc(c.update) || "∅"}</div><div class="why">${esc(c.reason)}</div>` +
        (g ? `<div class="gl">Glossary: ${esc(g.kjv_form)} → ${g.update === "KEEP" ? "kept" : esc(g.update)} <span class="st ${g.status}">${g.status}</span></div>` : "") + ev + `</li>`;
    }).join("")}</ul>` : `<p class="empty" style="margin:0">No committee changes; the KJV wording stands${mech.length ? " apart from routine updates" : ""}.</p>`) + `</div>`);
    if (mech.length) parts.push(`<details class="more"><summary>${mech.length} routine update${mech.length > 1 ? "s" : ""} (thee → you, hath → has), made by code</summary><div class="ev">${mech.map((c) => `${esc(c.kjv)} → ${esc(c.update)}`).join("\n")}</div></details>`);
    if (d && d.outcome !== "escalate") {
      const outcome = d.decided_by && d.decided_by !== "coordinator" ? `Decided by ${esc(d.decided_by)}` : d.outcome === "select" ? `Chose the ${esc(who(d.winner_author))} translation` : "Combined changes from several translations";
      parts.push(`<div><h4>How it was decided</h4><dl class="kv"><dt>Outcome</dt><dd>${outcome}</dd>${d.confidence != null ? `<dt>Confidence</dt><dd>${Math.round(d.confidence * 100)}%</dd>` : ""}<dt>Debate</dt><dd>${d.debate?.ran ? "Yes" : "No"}</dd></dl>${d.rationale ? `<p class="rationale">${esc(d.rationale)}</p>` : ""}</div>`);
    }
    if (b?.candidates?.length) {
      parts.push(`<details class="more"><summary>Every translation of this verse (${b.candidates.filter((c) => c.verses[v.id]).length})</summary><div class="cands" style="margin-top:8px">${b.candidates.filter((c) => c.verses[v.id]).map((c) => {
        const win = d && d.winner === c.id && d.outcome !== "escalate";
        return `<div class="cand${win ? " win" : ""}"><div class="who"><b>${esc(who(c.author))}</b>${win ? `<span class="pill green">chosen</span>` : ""}</div><div class="txt">${runsHtml(c.verses[v.id].runs)}</div><div class="who">${gates(c, b)}</div></div>`;
      }).join("")}</div></details>`);
      const notes = [];
      for (const r of b.reviews) for (const [cid, x] of Object.entries(r.candidates)) for (const n of x.notes || [])
        if (n.includes(v.id) && !/copied from|taken from the check report/i.test(n)) notes.push(`<p class="note"><b>${who(r.reviewer)} on ${esc(who((b.candidates.find((c) => c.id === cid) || {}).author || cid))}:</b> ${esc(n)}</p>`);
      if (notes.length) parts.push(`<details class="more"><summary>Reviewer notes (${notes.length})</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${notes.join("")}</div></details>`);
    }
    return parts.join("");
  }

  // ---------- glossary, run ----------
  function renderGlossary() {
    const fs = [["all", "All"], ["changes", "Word changes"], ["keep", "Kept words"], ["ratified", "Ratified"]];
    $("#glfilters").innerHTML = fs.map(([k, l]) => `<button class="chip" data-glf="${k}" aria-pressed="${state.glf === k}">${l}</button>`).join("");
    const q = state.gq.toLowerCase();
    const rows = DATA.glossary.filter((g) => (state.glf === "all" || (state.glf === "keep" ? g.update === "KEEP" : state.glf === "changes" ? g.update !== "KEEP" : g.status === "ratified")) && (!q || [g.kjv_form, g.update, g.sense].join(" ").toLowerCase().includes(q)));
    $("#gltable").innerHTML = `<thead><tr><th>KJV</th><th>KJME</th><th>Meaning covered</th><th>Status</th><th>Uses</th><th>Verses</th></tr></thead><tbody>` +
      (rows.length ? rows.map((g) => `<tr><td class="serif">${esc(g.kjv_form)}</td><td class="serif">${g.update === "KEEP" ? `<span class="sub">kept</span>` : esc(g.update)}</td><td>${esc(g.sense)}${g.notes ? `<div class="sub">${esc(g.notes)}</div>` : ""}</td>` +
        `<td><span class="st ${g.status}">${g.status}</span></td><td class="mono">${g.uses}</td><td>${g.examples.filter((x) => byId.has(x)).map((x) => `<a href="#v-${x.replace(/\./g, "-")}" data-jump="${x}">${ref(x)}</a>`).join(", ")}</td></tr>`).join("") :
        `<tr><td colspan="6" class="empty">No entries match.</td></tr>`) + `</tbody>`;
  }
  function renderRun() {
    const wins = Object.entries(R.wins).sort((a, b) => b[1] - a[1]), max = Math.max(1, ...wins.map(([, n]) => n));
    const iss = R.verification.issues;
    $("#runinfo").innerHTML = `<article class="card"><h3>This run</h3><div class="grid2"><dl class="kv"><dt>Run</dt><dd class="mono">${esc(R.id)}</dd><dt>Verses</dt><dd>${R.verses} (${R.accepted} accepted, ${R.pending} waiting)</dd>` +
      `<dt>Passages</dt><dd>${R.batches}, ${R.debated} went to debate</dd><dt>Word changes</dt><dd>${R.changes} by the committee, ${R.mechanical} routine</dd><dt>Spent</dt><dd>$${R.spend_usd.toFixed(2)} ($${(R.spend_usd / Math.max(1, R.verses)).toFixed(3)} per verse)</dd><dt>Generated</dt><dd>${esc(new Date(R.generated).toLocaleString())}</dd></dl>` +
      `<div><h4 class="eyebrow" style="margin:0 0 10px">How each passage was settled</h4><div class="bars">${wins.map(([k, n]) => `<div class="barrow"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${(n / max) * 100}%"></span></span><span>${n}</span></div>`).join("")}</div></div></div></article>` +
      `<article class="card"><h3>Display verification</h3><p style="margin:0">Before this page was written, every verse's KJV and KJME text was rebuilt from the pieces shown here and compared with the originals. Every change's position was checked against both texts, every difference was matched to a logged change, and every plural mark was checked to sit on "you", "your" or "yours".</p>` +
      (iss.length ? `<ul>${iss.map((x) => `<li><a href="#v-${x.verse.replace(/\./g, "-")}" data-jump="${x.verse}">${esc(x.verse)}</a>: ${esc(x.issue)}</li>`).join("")}</ul>` : `<p class="verify ok" style="align-self:flex-start">All ${R.verification.checked} verses passed</p>`) + `</article>`;
  }

  // ---------- routing ----------
  function render() {
    renderTabs();
    if (state.tab === "decisions") renderDecisions();
    if (state.tab === "text") renderText();
    if (state.tab === "glossary") renderGlossary();
    if (state.tab === "run") renderRun();
    setNavH();
  }
  function setHash(h) { if (location.hash !== h) history.replaceState(null, "", h); }
  function select(id, scroll) {
    if (!byId.has(id)) return;
    state.sel = id; state.tab = "text";
    if (!visible(byId.get(id))) { state.filter = "all"; state.cats.clear(); state.q = ""; $("#q").value = ""; }
    render();
    const el = document.getElementById("v-" + id.replace(/\./g, "-"));
    if (scroll && el) el.scrollIntoView({ block: narrow() ? "start" : "center" });
    setHash("#v-" + id.replace(/\./g, "-"));
  }
  function route() {
    const h = location.hash.slice(1);
    if (h.startsWith("v-")) { const id = h.slice(2).replace(/-/g, "."); if (byId.has(id)) return select(id, true); }
    if (h.startsWith("d-")) { const i = D.findIndex((d) => d.batch.replace(/\./g, "-") === h.slice(2)); if (i >= 0) { state.tab = "decisions"; state.di = i; return render(); } }
    if (["decisions", "text", "glossary", "run"].includes(h)) { state.tab = h; return render(); }
    if (h.startsWith("ch-")) { state.tab = "text"; render(); document.getElementById(h)?.scrollIntoView(); return; }
    render();
  }
  function setNavH() { const n = $("nav.tabsbar"); document.documentElement.style.setProperty("--navh", (window.matchMedia("(max-width: 760px)").matches ? 0 : n.offsetHeight) + "px"); }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a, .verse, li.ch");
    if (!t) return;
    const ds = t.dataset;
    if (ds.tab) { state.tab = ds.tab; setHash("#" + ds.tab); render(); window.scrollTo({ top: 0 }); return; }
    if (ds.di !== undefined) { const i = +ds.di; if (i >= 0 && i < D.length) { state.di = i; setHash("#d-" + D[i].batch.replace(/\./g, "-")); renderDecisions(); setNavH(); document.querySelector(".decision")?.scrollIntoView({ block: "start" }); } return; }
    if (ds.choose) { choices[ds.batch] === ds.choose ? delete choices[ds.batch] : (choices[ds.batch] = ds.choose); store.set(choicesKey, choices); renderTabs(); renderDecisions(); return; }
    if (t.hasAttribute("data-copy-msg")) { copy(t, messageText()); return; }
    if (t.hasAttribute("data-copy-cmd")) { copy(t, commandsText()); return; }
    if (t.hasAttribute("data-clear")) { for (const k of Object.keys(choices)) delete choices[k]; store.set(choicesKey, choices); render(); return; }
    if (ds.openText) { select(ds.openText, true); return; }
    if (ds.gotoDecision !== undefined) { state.tab = "decisions"; state.di = +ds.gotoDecision; setHash("#d-" + D[state.di].batch.replace(/\./g, "-")); render(); window.scrollTo({ top: 0 }); return; }
    if (ds.view) { state.view = ds.view; store.set("view", state.view); renderText(); return; }
    if (ds.filter) { state.filter = ds.filter; renderText(); return; }
    if (ds.cat) { state.cats.has(ds.cat) ? state.cats.delete(ds.cat) : state.cats.add(ds.cat); renderText(); return; }

    if (ds.glf) { state.glf = ds.glf; renderGlossary(); return; }
    if (ds.go) { select(ds.go, true); return; }
    if (ds.jump) { e.preventDefault(); select(ds.jump, true); return; }
    if (t.matches("li.ch")) { const row = state.sel && document.getElementById("v-" + state.sel.replace(/\./g, "-"));
      row?.querySelectorAll("[data-k]").forEach((el) => { if (el.dataset.k.split(",").includes(ds.k)) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200); } }); return; }
    if (t.classList.contains("verse")) { select(ds.id, false); return; }
  });
  document.addEventListener("keydown", (e) => { const v = e.target.closest?.(".verse"); if (v && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(v.dataset.id, false); } });
  $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); renderText(); });
  document.addEventListener("change", (e) => {
    if (e.target.id === "catsel") { state.cats = new Set(e.target.value ? [e.target.value] : []); renderText(); }
    if (e.target.id === "mechbtn") { state.mech = e.target.checked; store.set("mech", state.mech); syncText(); }
  });
  $("#gq").addEventListener("input", (e) => { state.gq = e.target.value.trim(); renderGlossary(); });
  window.addEventListener("hashchange", route);
  let wasNarrow = narrow();
  window.addEventListener("resize", () => { setNavH(); if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (state.tab === "text") placePanel(); } });

  $("#foot").innerHTML = `King James Margin Edition, pilot run. An independent Mzed Studio experiment; principles adapted from the KJV Update Project, which is not affiliated. Base text: KJV 1769. Greek data: STEPBible, Tyndale House (CC BY 4.0). Not a release.`;
  route();
})();
</script>
