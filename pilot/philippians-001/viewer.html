.4.b02.minimalist"],"supersedes":null,"at":"2026-11-08T13:19:01.344Z"},"reviews":[{"reviewer":"reviewer-scorer","round":2,"id":"rev-2-mw7uy7wc-9o","summary":"A wins: it makes only the changes the rules require, including the R4 shift of 'honest' to 'honourable', and its spelling matches the KJV base text and the accepted neighbouring batch. C is a close second with the same required changes but the US spelling 'honorable'; B fails G1 by leaving 'honest' in a word whose modern default sense alters the verse's meaning, and M fails G5 by not applying the ratified 'unto' and 'brethren' entries.","candidates":{"PHP.4.b02.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":4,"S3":5,"S4":5},"weighted":0.94,"notes":[],"comments":[{"change_id":"c5","verdict":"agree","reason":"R4/P1: the KJV sense of 'honest' here is creditable/of good report (cf. Acts 6:3, Rom 12:17); modern 'honest' would default to 'truthful' and collapse the distinction with the preceding 'true'. 'Honourable' carries the KJV sense, and the -our- form matches the KJV base text itself (R10, P3)."},{"change_id":"c1","verdict":"agree","reason":"R4/P1 and g-careful-anxious: 'careful' in this sense is anxious/full of care; the modern default 'careful' would change the meaning."},{"change_id":"c2","verdict":"agree","reason":"R3/g-unto-to ratified: 'unto' as indirect object becomes 'to'."},{"change_id":"c4","verdict":"agree","reason":"R3/g-brethren-brothers ratified: 'brethren' becomes 'brothers' without expansion (R9)."}]},"PHP.4.b02.cadence":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.4.8: 'honest' left unchanged; the modern default sense ('truthful') does not match the KJV sense ('creditable, of good report') and would collapse the verse's distinction with 'whatsoever things are true', altering the meaning for a modern reader (G1/P1, R4). The needed edit is also absent from the change log, so G4 cannot cover it."],"comments":[{"change_id":"c1","verdict":"agree","reason":"R4/P1: correct handling of 'careful' in the anxious sense."},{"change_id":"c2","verdict":"agree","reason":"R3/g-unto-to ratified."}]},"PHP.4.b02.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":4,"S3":5,"S4":4},"weighted":0.92,"notes":[],"comments":[{"change_id":"c5","verdict":"alternative","alternative_text":"honourable","reason":"The change is required (R4/P1), but 'honorable' is a US spelling not used in the KJV base text (KJV writes 'honour'), so the -our- form is the better choice under R10/P3 and keeps the edition's spelling consistent with the source (P7)."},{"change_id":"c1","verdict":"agree","reason":"R4/P1 and g-careful-anxious: 'careful' must become 'anxious' in this sense."},{"change_id":"c2","verdict":"agree","reason":"R3/g-unto-to ratified."},{"change_id":"c4","verdict":"agree","reason":"R3/g-brethren-brothers ratified."}]},"PHP.4.b02.mechanical":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"fail"},"scores":null,"weighted":null,"notes":["PHP.4.6: 'unto' not rendered as 'to' per ratified entry g-unto-to (G5/P7).","PHP.4.8: 'brethren' not rendered as 'brothers' per ratified entry g-brethren-brothers (G5/P7)."],"comments":[]}}},{"reviewer":"reviewer-meaning-auditor","round":2,"id":"rev-2-mw7uyu0p-9t","summary":"In round 2 I keep all my verdicts. A and C keep the KJV meaning in every verse: 'careful' → 'anxious' and 'honest' → 'honourable'/'honorable' both bring back the 1611 senses, and the KJV's own uses of 'honest' (ACT.6.3, ROM.12.17, 1PE.2.12) confirm this. B fails G1 because it keeps 'honest' in PHP.4.8, and M fails G1 because it keeps both 'careful' and 'honest', and fails G5 because it leaves 'brethren' against a ratified entry.","candidates":{"PHP.4.b02.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.4.6: 'careful' → 'anxious' keeps the KJV sense 'full of care' (R4), and the imperative is kept. 'Anxious for' can also mean 'eager for', but in a negated command the reading 'worried about' clearly dominates. This is not a G1 failure.","PHP.4.7: 'passes' (mechanical) keeps the sense 'surpasses', with the same range as 'passeth'. 'Shall keep' is unchanged, so tense and modality are kept.","PHP.4.8: 'honest' → 'honorable' brings back the KJV sense. The KJV's own uses show 'honest' meaning creditable or seemly: 'men of honest report' (ACT.6.3), 'Provide things honest in the sight of all men' (ROM.12.17), 'Having your conversation honest among the Gentiles' (1PE.2.12) (L-mw7uy89h-9q). This is the KJV's own sense, not a retranslation. 'Honorable' is not a copy of the dataset gloss 'noble' (L-mw7uy9k8-9s). The subjunctive 'if there be' is kept with its italics.","A's evidence checks out: the occurrences lookup supports the claimed sense of 'honest', and citing the Greek to settle the KJV sense is allowed under R12/P5.","PHP.4.7/4.8/4.9: the C6 warnings about g-of-by are false positives. 'peace of God', 'God of peace' and 'of good report' are not passive-agent uses, so G5 passes."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4/P1: in the KJV 'careful' means anxious. Keeping it would reverse the sense for a modern reader."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"Follows ratified entry g-unto-to. The meaning is unchanged."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"R2: 'passes' keeps the sense 'surpasses'."},{"change_id":"c4","verdict":"agree","alternative_text":null,"reason":"Follows ratified entry g-brethren-brothers and is not expanded."},{"change_id":"c5","verdict":"agree","alternative_text":null,"reason":"R4/P1: brings back the KJV sense of 'honest' (honourable, seemly), as shown by ACT.6.3, ROM.12.17 and 1PE.2.12 (L-mw7uy89h-9q). Choosing between 'honorable' and 'honourable' is a spelling and consistency question, not a meaning question."},{"change_id":"c6","verdict":"agree","alternative_text":null,"reason":"R1: the plural mark is kept."}]},"PHP.4.b02.cadence":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.4.8: 'whatsoever things are honest': B keeps a word whose meaning has shifted (R4, P1). In the KJV, 'honest' means honourable or seemly (ACT.6.3, ROM.12.17, 1PE.2.12; L-mw7uy89h-9q). A modern reader takes it as 'truthful', which only repeats 'true', so the verse no longer means what the KJV means. A faithful fix: 'whatsoever things are honourable' (or 'honorable').","B's evidence for c2 and c4 cites the Greek. This does no harm, because both changes rest on ratified glossary entries, but the Greek adds nothing (R12).","PHP.4.7/4.8/4.9: the g-of-by warnings are false positives. G5 passes."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4/P1: in the KJV 'careful' means anxious."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"Follows ratified entry g-unto-to."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"R2: a mechanical change, and the meaning is kept."},{"change_id":"c4","verdict":"agree","alternative_text":null,"reason":"Follows ratified entry g-brethren-brothers."},{"change_id":"c5","verdict":"agree","alternative_text":null,"reason":"R1: the plural mark is kept."}]},"PHP.4.b02.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.4.6: 'anxious' keeps the KJV sense. Keeping 'for nothing' leaves the imperative unchanged.","PHP.4.8: 'honest' → 'honourable' brings back the KJV sense, and the KJV's own uses support it (L-mw7uy89h-9q). C's cited examples ACT.6.3 and ROM.12.17 are correct. The subjunctive 'if there be' is kept with its italics.","PHP.4.7 and PHP.4.9 match the mechanical draft. Tense, modality and agency are kept."," s why 'anxious' works there and not here.","PHP.4.10: G5 passes in form, because the candidate cited g-careful-anxious. But that entry's example (PHP.4.6) is a different sense. Under P7 this verse needs a separate sense entry, not the 4.6 entry.","PHP.4.11: keeping 'want' is borderline but passes. As a noun, 'want' still means lack ('for want of'), and 4.12 'suffer need' supports that reading.","PHP.4.10/4.11/4.15: the C6 warnings on 'of' are false positives. None of them marks a passive agent, so g-of-by does not apply."],"comments":[{"change_id":"c1","verdict":"alternative","alternative_text":"wherein you were also concerned","reason":"R4/G1: 'anxious' adds worry. 'Concerned' keeps the KJV sense of being full of care for someone (compare 2KI.4.13), and it is still one word for one word (R3). This needs a separate glossary sense entry (P7)."},{"change_id":"c5","verdict":"agree","alternative_text":null,"reason":"R2: tense, person and agency unchanged."},{"change_id":"c6","verdict":"agree","alternative_text":null,"reason":"R4: keeps the sense of taking part in."},{"change_id":"c9","verdict":"agree","alternative_text":null,"reason":"R4: keeps the sense of partnership."}]},"PHP.4.b03.clarity":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.4.10: 'careful' → 'anxious': same G1 failure as in A (R4, P1, connotation).","PHP.4.11: 'in respect of' → 'with respect to': a G1 risk (ambiguity). Early modern 'in respect of' could mean 'on account of, because of' as well as 'regarding'. The KJV's κατά, used only to settle the English sense, fits the causal reading. Modern 'with respect to' means only 'regarding', so it settles the ambiguity. The change is optional (P2, R11).","PHP.4.12: 'abased' → 'humbled' keeps the sense of being brought low, and it pairs with 'abound'. Passes.","PHP.4.11: 'therewith' → 'with that' must inherit the italics (R6). The coordinator should check that the italic span carried over."],"c -keep","kjv_form":"earnest","forms":[],"sense":"adjective meaning ardent, intense, as in 'earnest expectation'","update":"KEEP","category":"shifted_meaning","status":"provisional","uses":0,"examples":["PHP.1.20"],"notes":"","seed":false},{"id":"g-excellency-keep","kjv_form":"excellency","forms":[],"sense":"surpassing worth or preeminence of something, as in 'the excellency of the knowledge of Christ'","update":"KEEP","category":"archaic_word","status":"provisional","uses":0,"examples":["PHP.3.8"],"notes":"","seed":false},{"id":"g-fallen-out-keep","kjv_form":"fallen out","forms":[],"sense":"turned out, came about (not 'quarreled'), as in 'have fallen out rather unto the furtherance'","update":"KEEP","category":"shifted_meaning","status":"provisional","uses":0,"examples":["PHP.1.12"],"notes":"","seed":false},{"id":"g-fellowlabourers-keep","kjv_form":"fellowlabourers","forms":[],"sense":"co-workers, people who labour together; KJV compound spelling","update":"KEEP","category":"spelling","status":"provisional","uses":0,"examples":["PHP.4.3"],"notes":"","seed":false},{"id":"g-fellowship-keep","kjv_form":"fellowship","forms":[],"sense":"sharing or partnership in a common work, as in 'fellowship in the gospel'","update":"KEEP","category":"shifted_meaning","status":"provisional","uses":0,"examples":["PHP.1.5"],"notes":"","seed":false},{"id":"g-furtherance-keep","kjv_form":"furtherance","forms":[],"sense":"advancement, progress","update":"KEEP","category":"archaic_word","status":"provisional","uses":0,"examples":["PHP.1.25"],"notes":"","seed":false},{"id":"g-grievous-keep","kjv_form":"grievous","forms":[],"sense":"troublesome, irksome, a burden to do, as in 'to me indeed is not grievous'","update":"KEEP","category":"archaic_word","status":"provisional","uses":0,"examples":["PHP.3.1"],"notes":"","seed":false},{"id":"g-hear-to-be-keep","kjv_form":"hear ... to be","forms":[],"sense":"object followed by an infinitive after a verb of perceiving or reporting, as in 'which ye ... n pends on keeping one word.","update":"KEEP","category":"shifted_meaning","status":"provisional","uses":0,"examples":["PHP.3.15"],"notes":"","seed":false},{"id":"g-pretence-keep","kjv_form":"pretence","forms":[],"sense":"British spelling of 'pretense' (a false show or pretext)","update":"KEEP","category":"spelling","status":"provisional","uses":0,"examples":["PHP.1.18"],"notes":"","seed":false},{"id":"g-record-witness","kjv_form":"record","forms":[],"sense":"a person who bears witness or testifies, as in 'God is my record' (parallel to 'my witness' in JOB.16.19); not a written account","update":"witness","category":"shifted_meaning","status":"provisional","uses":0,"examples":["PHP.1.8"],"notes":"","seed":false},{"id":"g-salute-keep","kjv_form":"salute","forms":[],"sense":"verb meaning to greet or send greetings to a person ('Salute every saint', 'All the saints salute you')","update":"KEEP","category":"archaic_word","status":"provisional","uses":0,"examples":["PHP.4.21"],"notes":"","seed":false},{"id":"g-strait-keep","kjv_form":"strait","forms":[],"sense":"noun: a difficult position or dilemma, as in 'in a strait betwixt two'","update":"KEEP","category":"archaic_word","status":"provisional","uses":0,"examples":["PHP.1.23"],"notes":"","seed":false},{"id":"g-suffer-keep","kjv_form":"suffer","forms":[],"sense":"endure hardship or pain, as in 'to suffer for his sake'; not the 'permit, allow' sense of g-suffer-allow","update":"KEEP","category":"shifted_meaning","status":"provisional","uses":0,"examples":["PHP.1.29","PHP.3.8"],"notes":"also: undergo or experience something, such as loss, as in 'suffered the loss of all things'. This is not the 'permit, allow' sense in g-suffer-allow.","seed":false},{"id":"g-think-on-keep","kjv_form":"think on","forms":[],"sense":"consider, dwell upon; still understood","update":"KEEP","category":"syntax","status":"provisional","uses":0,"examples":["PHP.4.8"],"notes":"","seed":false},{"id":"g-turn-to-keep","kjv_form":"turn to","forms":[],"s   const NAME = { "translator-minimalist": "Minimalist", "translator-clarity": "Clarity", "translator-cadence": "Cadence", mechanical: "KJV with routine updates only", coordinator: "Coordinator", "reviewer-scorer": "Scorer", "reviewer-meaning-auditor": "Auditor" };

  const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;

  const tabs = [["decisions", "Your decisions"], ["text", "Text"], ["glossary", "Glossary"], ["run", "Run"]];
  function renderTabs() {
    const left = D.filter((d) => !choices[d.batch]).length;
    $("#tabs").innerHTML = tabs.map(([k, l]) => {
      const n = k === "decisions" ? (D.length ? `<span class="count${left ? " hot" : ""}">${left ? left + " left" : "done"}</span>` : "") : k === "glossary" ? `<span class="count">${DATA.glossary.length}</span>` : "";

  }
  function copy(btn, text) {
    const done = () => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = o), 1400); };

  }

    btn.closest(".out, .opt-foot, .panel")?.appendChild(ta); ta.select();
  }

  // ---------- decisions ----------
  function optLabel(o) {
    if (o.keeps_kjv) return `Keep the KJV wording${o.focus_changes.length === 0 && o.other_changes.length ? " here" : ""}`;
    return o.focus_changes.map((c) => `<s>${esc(c.from) || "∅"}</s> <span class="arrow">→</span> ${esc(c.to) || "∅"}`).join("<span class='arrow'>; </span>");
  }
  function optPlain(o) {

  function messageText() {
    const lines = D.map((d) => {

  }
  function commandsText() {

  }

  function sendBox(done, cls) {

      <div class="btns"><button class="btn small primary" data-copy-msg ${done ? "" : "disabled"}>Copy as message</button><button class="btn small" data-copy-cmd ${done ? "" : "disabled"}>Copy commands</button>${done ? `<button class="btn small" data-clear>Clear</button>` : ""}</div></div>`;
  }
  function renderDecisions() {

      ${sendBox(done, "out-desk")}
    </aside>`;

    const opts = d.options.map((o, i) => {
      const chosen = choices[d.batch] === o.choose;
      const reads = d.focus_verses.map((vid) => `<div class="vrow"><span class="vref">${ref(vid)}</span><div class="verse-text">${runsHtml(o.verses[vid].runs)}</div></div>`).join("");
      const also = o.other_changes.length ? `<p class="also"><b>This option also changes, elsewhere in ${esc(d.passage.replace(DATA.book + " ", ""))}:</b> ${o.other_changes.map((c) => `${ref(c.verse)} ${esc(c.from) || "∅"} → ${esc(c.to) || "∅"}`).join("; ")}</p>` : "";
      const flags = o.fail_notes.length ? `<details class="flag"><summary>Why the reviewers flagged it</summary><ul>${o.fail_notes.map((f) => `<li><b>${f.reviewer === "auditor" ? "Auditor" : "Scorer"}:</b> ${esc(f.note)}</li>`).join("")}</ul></details>` : "";
      return `<article class="opt${chosen ? " chosen" : ""}" aria-label="Option ${L(i)}">
        <div class="opt-head"><span class="letter">${L(i)}</span><span class="opt-title">${optLabel(o)}</span>${o.recommended ? `<span class="pill rec">Recommended</span>` : ""}${reviewPill(o)}</div>
        <div class="opt-body"><div class="reads" aria-label="How the verse would read">${reads}</div>${also}${o.recommended && d.why ? `<p class="rec-why"><b>Why it is recommended:</b> ${esc(d.why)}</p>` : ""}${flags}</div>
        <div class="opt-foot"><span class="who">${o.authors.every((a) => a === "mechanical") ? "The KJV with routine updates only" : "Proposed by " + o.authors.filter((a) => a !== "mechanical").map(who).join(", ")}</span><button class="choose" data-choose="${esc(o.choose)}" data-batch="${esc(d.batch)}" aria-pressed="${chosen}">${chosen ? "Chosen ✓" : "Choose " + L(i)}</button></div>

  // ---------- text ----------
  const views = [["read", "Read"], ["diff", "Diff"], ["parallel", "Side by side"]];

  const usedCats = [...new Set(DATA.verses.flatMap((v) => v.changes.filter((c) => !c.auto && !/^pronoun_|^verb_form$/.test(c.category)).map((c) => c.category)))];

    `<label class="sub" style="display:inline-flex;gap:8px;align-items:center;margin:0">Type <select id="catsel" class="search" style="min-width:150px;max-width:200px;flex:0 0 auto"><option value="">All types</option>${usedCats.map((c) => `<option value="${c}">${CAT[c] || c}</option>`).join("")}</select></label>`;
  $("#legend").innerHTML = `<span><span class="chg">word</span> changed</span><span><span class="del">word</span> KJV word replaced (Diff)</span><span>you<sup class="pl">pl</sup> plural "you"</span><span><span class="it">italic</span> supplied word</span><span><label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="mechbtn"> show routine updates</label></span>`;
  $("#chapnav").innerHTML = DATA.chapters.map((c) => `<a href="#ch-${c}" data-ch="${c}">Chapter ${c}</a>`).join("");

  function syncText() {
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));

  function visible(v) {

    if (state.filter === "pending" && v.status === "accepted") return false;
    if (state.cats.size && !v.changes.some((c) => !c.auto && state.cats.has(c.category))) return false;
    if (state.q) {
      const q = state.q.toLowerCase(), plain = (rs) => rs.filter((r) => !r.m).map((r) => r.t).join("").toLowerCase();
      if (!(v.ref.toLowerCase().includes(q) || `${v.ch}:${v.v}` === q || plain(v.runs.read).includes(q) || plain(v.runs.kjv).includes(q))) return false;
    }
    return true;
  }
  function decisionFor(vid) { return D.findIndex((d) => d.verses.includes(vid) || DATA.batches[d.batch]?.verses.includes(vid)); }
  function verseHtml(v) {
    const n = v.changes.filter((c) => !c.auto).length;
    const b = DATA.batches[v.batch];
    const human = b?.decision?.decided_by && b.decision.decided_by !== "coordinator";
    const body = state.view === "parallel" ? `<div class="parallel"><div class="k"><span class="lbl">KJV 1769</span>${runsHtml(v.runs.kjv)}</div><div><span class="lbl">KJME</span>${runsHtml(v.runs.read)}</div></div>` : runsHtml(state.view === "diff" ? v.runs.inline : v.runs.read);
    const di = v.status !== "accepted" ? decisionFor(v.id) : -1;

    void n;
    const pills = [firstOfPassage ? `<span class="pill red">Waiting for your decision: ${esc(D[di].passage.replace(DATA.book + " ", ""))}</span><button class="btn small" data-goto-decision="${di}">Decide</button>` : "",
      human ? `<span class="pill green">Decided by ${esc(b.decision.decided_by)}</span>` : "", v.issues.length ? `<span class="pill amber">Display issue</span>` : ""].join("");
    return `<div class="verse${state.sel === v.id ? " sel" : ""}${v.status !== "accepted" ? " waiting" : ""}" id="v-${v.id.replace(/\./g, "-")}" data-id="${v.id}" tabindex="0" role="button" aria-label="${esc(v.ref)}"><div class="vnum">${v.v}</div><div class="vtext">${body}</div>${pills ? `<div class="vmeta">${pills}</div>` : ""}</div>`;
  }
  function renderText() {
    syncText();
    let shown = 0;
    const out = DATA.chapters.map((ch) => {
      const vs = DATA.verses.filter((v) => v.ch === ch && visible(v));

      return `<h2 class="chapter" id="ch-${ch}">${esc(DATA.book)} ${ch}</h2>` + (vs.length ? vs.map(verseHtml).join("") : `<p class="empty">No verses in this chapter match.</p>`);
    }).join("");
    $("#verses").innerHTML = shown ? out : `<p class="empty">No verses match. Clear the filters or the search to see the text.</p>`;

  const narrow = () => window.matchMedia("(max-width: 920px)").matches;
  function placePanel() {
    document.querySelectorAll(".inline-panel").forEach((n) => n.remove());
    const html = state.sel && byId.get(state.sel) ? panelHtml(byId.get(state.sel)) :
      `<div class="empty"><h3 style="margin-bottom:8px">The margin</h3>Select a verse to see why each word changed, what each translator proposed, how the reviewers judged it, and who decided.</div>`;
    if (narrow()) {
      $("#margincol").innerHTML = "";
      const row = state.sel && document.getElementById("v-" + state.sel.replace(/\./g, "-"));
      if (row) row.insertAdjacentHTML("afterend", `<div class="panel inline-panel">${html}</div>`);
    } else $("#margincol").innerHTML = `<div class="panel">${html}</div>`;
  }
  function gates(c, b) {
    return b.reviews.map((r) => {
      const x = r.candidates[c.id];
      if (!x) return "";
      const g = ["G1", "G2"].map((k) => `<span class="gate${x.gates[k] === "fail" ? " fail" : ""}">${k === "G1" ? "meaning" : "number"} ${x.gates[k] === "fail" ? "✗" : "✓"}</span>`).join(" ");

    }).join(" ");
  }
  function panelHtml(v) {
    const b = DATA.batches[v.batch], d = b?.decision;
    const committee = v.changes.filter((c) => !c.auto), mech = v.changes.filter((c) => c.auto);
    const i = order.indexOf(v.id), di = decisionFor(v.id);
    const parts = [`<div class="phead"><div><h3>${esc(v.ref)}</h3><div class="sub">${v.status === "accepted" ? "Accepted" : "Waiting for your decision"}</div></div>` +
      `<div class="navbtns"><button class="iconbtn" data-go="${order[i - 1] || ""}" ${i <= 0 ? "disabled" : ""} aria-label="Previous verse">↑</button><button class="iconbtn" data-go="${order[i + 1] || ""}" ${i >= order.length - 1 ? "disabled" : ""} aria-label="Next verse">↓</button></div></div>`];
    if (v.issues.length) parts.push(`<div class="callout amber"><b>Display issues</b><ul>${v.issues.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`);

    parts.push(`<div><h4>What changed</h4>` + (committee.length ? `<ul class="chlist">${committee.map((c) => {
      const g = c.glossary_id && gl.get(c.glossary_id);

        return `<details class="more"><summary>Evidence${l ? `: ${esc(l.query?.function || "lookup")} by ${esc(who(l.agent))}` : e.lookup_id.startsWith("pre:") ? ": Greek for this verse" : ""}</summary><div class="ev">${esc(e.note || "")}${l ? "\n\n" + esc(l.summary) : ""}</div></details>`; }).join("");
      return `<li class="ch" data-k="${esc(c.id)}"><span class="cat cat-${c.category}"><span class="dot"></span>${CAT[c.category] || esc(c.category)}</span><div class="words"><s>${esc(c.kjv) || "∅"}</s> → ${esc(c.update) || "∅"}</div><div class="why">${esc(c.reason)}</div>` +
        (g ? `<div class="gl">Glossary: ${esc(g.kjv_form)} → ${g.update === "KEEP" ? "kept" : esc(g.update)} <span class="st ${g.status}">${g.status}</span></div>` : "") + ev + `</li>`;
    }).join("")}</ul>` : `<p class="empty" style="margin:0">No committee changes; the KJV wording stands${mech.length ? " apart from routine updates" : ""}.</p>`) + `</div>`);
    if (mech.length) parts.push(`<details class="more"><summary>${mech.length} routine update${mech.length > 1 ? "s" : ""} (thee → you, hath → has), made by code</summary><div class="ev">${mech.map((c) => `${esc(c.kjv)} → ${esc(c.update)}`).join("\n")}</div></details>`);
    if (d && d.outcome !== "escalate") {
      const outcome = d.decided_by && d.decided_by !== "coordinator" ? `Decided by ${esc(d.decided_by)}` : d.outcome === "select" ? `Chose the ${esc(who(d.winner_author))} translation` : "Combined changes from several translations";
      parts.push(`<div><h4>How it was decided</h4><dl class="kv"><dt>Outcome</dt><dd>${outcome}</dd>${d.confidence != null ? `<dt>Confidence</dt><dd>${Math.round(d.confidence * 100)}%</dd>` : ""}<dt>Debate</dt><dd>${d.debate?.ran ? "Yes" : "No"}</dd></dl>${d.rationale ? `<p class="rationale">${esc(d.rationale)}</p>` : ""}</div>`);
    }
    if (b?.candidates?.length) {
      parts.push(`<details class="more"><summary>Every translation of this verse (${b.candidates.filter((c) => c.verses[v.id]).length})</summary><div class="cands" style="margin-top:8px">${b.candidates.filter((c) => c.verses[v.id]).map((c) => {

      const notes = [];
      for (const r of b.reviews) for (const [cid, x] of Object.entries(r.candidates)) for (const n of x.notes || [])
        if (n.includes(v.id) && !/copied from|taken from the check report/i.test(n)) notes.push(`<p class="note"><b>${who(r.reviewer)} on ${esc(who((b.candidates.find((c) => c.id === cid) || {}).author || cid))}:</b> ${esc(n)}</p>`);
      if (notes.length) parts.push(`<details class="more"><summary>Reviewer notes (${notes.length})</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${notes.join("")}</div></details>`);
    }
    return parts.join("");
  }

  // ---------- glossary, run ----------
  function renderGlossary() {
    const fs = [["all", "All"], ["changes", "Word changes"], ["keep", "Kept words"], ["ratified", "Ratified"]];
    $("#glfilters").innerHTML = fs.map(([k, l]) => `<button class="chip" data-glf="${k}" aria-pressed="${state.glf === k}">${l}</button>`).join("");
    const q = state.gq.toLowerCase();
    const rows = DATA.glossary.filter((g) => (state.glf === "all" || (state.glf === "keep" ? g.update === "KEEP" : state.glf === "changes" ? g.update !== "KEEP" : g.status === "ratified")) && (!q || [g.kjv_form, g.update, g.sense].join(" ").toLowerCase().includes(q)));
    $("#gltable").innerHTML = `<thead><tr><th>KJV</th><th>KJME</th><th>Meaning covered</th><th>Status</th><th>Uses</th><th>Verses</th></tr></thead><tbody>` +
      (rows.length ? rows.map((g) => `<tr><td class="serif">${esc(g.kjv_form)}</td><td class="serif">${g.update === "KEEP" ? `<span class="sub">kept</span>` : esc(g.update)}</td><td>${esc(g.sense)}${g.notes ? `<div class="sub">${esc(g.notes)}</div>` : ""}</td>` +
        `<td><span class="st ${g.status}">${g.status}</span></td><td class="mono">${g.uses}</td><td>${g.examples.filter((x) => byId.has(x)).map((x) => `<a href="#v-${x.replace(/\./g, "-")}" data-jump="${x}">${ref(x)}</a>`).join(", ")}</td></tr>`).join("") :
        `<tr><td colspan="6" class="empty">No entries match.</td></tr>`) + `</tbody>`;
  }
  function renderRun() {
    const wins = Object.entries(R.wins).sort((a, b) => b[1] - a[1]), max = Math.max(1, ...wins.map(([, n]) => n));
    const iss = R.verification.issues;
    $("#runinfo").innerHTML = `<article class="card"><h3>This run</h3><div class="grid2"><dl class="kv"><dt>Run</dt><dd class="mono">${esc(R.id)}</dd><dt>Verses</dt><dd>${R.verses} (${R.accepted} accepted, ${R.pending} waiting)</dd>` +
      `<dt>Passages</dt><dd>${R.batches}, ${R.debated} went to debate</dd><dt>Word changes</dt><dd>${R.changes} by the committee, ${R.mechanical} routine</dd><dt>Spent</dt><dd>$${R.spend_usd.toFixed(2)} ($${(R.spend_usd / Math.max(1, R.verses)).toFixed(3)} per verse)</dd><dt>Generated</dt><dd>${esc(new Date(R.generated).toLocaleString())}</dd></dl>` +
      `<div><h4 class="eyebrow" style="margin:0 0 10px">How each passage was settled</h4><div class="bars">${wins.map(([k, n]) => `<div class="barrow"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${(n / max) * 100}%"></span></span><span>${n}</span></div>`).join("")}</div></div></div></article>` +
      `<article class="card"><h3>Display verification</h3><p style="margin:0">Before this page was written, every verse's KJV and KJME text was rebuilt from the pieces shown here and compared with the originals. Every change's position was checked against both texts, every difference was matched to a logged change, and every plural mark was checked to sit on "you", "your" or "yours".</p>` +
      (iss.length ? `<ul>${iss.map((x) => `<li><a href="#v-${x.verse.replace(/\./g, "-")}" data-jump="${x.verse}">${esc(x.verse)}</a>: ${esc(x.issue)}</li>`).join("")}</ul>` : `<p class="verify ok" style="align-self:flex-start">All ${R.verification.checked} verses passed</p>`) + `</article>`;
  }

  // ---------- routing ----------
  function render() {
    renderTabs();
    if (state.tab === "decisions") renderDecisions();
    if (state.tab === "text") renderText();
    if (state.tab === "glossary") renderGlossary();
    if (state.tab === "run") renderRun();
    setNavH();
  }
  function setHash(h) { if (location.hash !== h) history.replaceState(null, "", h); }
  function select(id, scroll) {
    if (!byId.has(id)) return;
    state.sel = id; state.tab = "text";
    if (!visible(byId.get(id))) { state.filter = "all"; state.cats.clear(); state.q = ""; $("#q").value = ""; }
    render();
    const el = document.getElementById("v-" + id.replace(/\./g, "-"));
    if (scroll && el) el.scrollIntoView({ block: narrow() ? "start" : "center" });
    setHash("#v-" + id.replace(/\./g, "-"));
  }
  function route() {
    const h = location.hash.slice(1);
    if (h.startsWith("v-")) { const id = h.slice(2).replace(/-/g, "."); if (byId.has(id)) return select(id, true); }
    if (h.startsWith("d-")) { const i = D.findIndex((d) => d.batch.replace(/\./g, "-") === h.slice(2)); if (i >= 0) { state.tab = "decisions"; state.di = i; return render(); } }
    if (["decisions", "text", "glossary", "run"].includes(h)) { state.tab = h; return render(); }
    if (h.startsWith("ch-")) { state.tab = "text"; render(); document.getElementById(h)?.scrollIntoView(); return; }
    render();
  }
  function setNavH() { const n = $("nav.tabsbar"); document.documentElement.style.setProperty("--navh", (window.matchMedia("(max-width: 760px)").matches ? 0 : n.offsetHeight) + "px"); }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a, .verse, li.ch");
    if (!t) return;
    const ds = t.dataset;
    if (ds.tab) { state.tab = ds.tab; setHash("#" + ds.tab); render(); window.scrollTo({ top: 0 }); return; }
    if (ds.di !== undefined) { const i = +ds.di; if (i >= 0 && i < D.length) { state.di = i; setHash("#d-" + D[i].batch.replace(/\./g, "-")); renderDecisions(); setNavH(); document.querySelector(".decision")?.scrollIntoView({ block: "start" }); } return; }
    if (ds.choose) { choices[ds.batch] === ds.choose ? delete choices[ds.batch] : (choices[ds.batch] = ds.choose); store.set(choicesKey, choices); renderTabs(); renderDecisions(); return; }
    if (t.hasAttribute("data-copy-msg")) { copy(t, messageText()); return; }
    if (t.hasAttribute("data-copy-cmd")) { copy(t, commandsText()); return; }
    if (t.hasAttribute("data-clear")) { for (const k of Object.keys(choices)) delete choices[k]; store.set(choicesKey, choices); render(); return; }
    if (ds.openText) { select(ds.openText, true); return; }
    if (ds.gotoDecision !== undefined) { state.tab = "decisions"; state.di = +ds.gotoDecision; setHash("#d-" + D[state.di].batch.replace(/\./g, "-")); render(); window.scrollTo({ top: 0 }); return; }
    if (ds.view) { state.view = ds.view; store.set("view", state.view); renderText(); return; }
    if (ds.filter) { state.filter = ds.filter; renderText(); return; }
    if (ds.cat) { state.cats.has(ds.cat) ? state.cats.delete(ds.cat) : state.cats.add(ds.cat); renderText(); return; }

    if (ds.glf) { state.glf = ds.glf; renderGlossary(); return; }
    if (ds.go) { select(ds.go, true); return; }
    if (ds.jump) { e.preventDefault(); select(ds.jump, true); return; }
    if (t.matches("li.ch")) { const row = state.sel && document.getElementById("v-" + state.sel.replace(/\./g, "-"));
      row?.querySelectorAll("[data-k]").forEach((el) => { if (el.dataset.k.split(",").includes(ds.k)) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200); } }); return; }
    if (t.classList.contains("verse")) { select(ds.id, false); return; }
  });
  document.addEventListener("keydown", (e) => { const v = e.target.closest?.(".verse"); if (v && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(v.dataset.id, false); } });
  $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); renderText(); });
  document.addEventListener("change", (e) => {
    if (e.target.id === "catsel") { state.cats = new Set(e.target.value ? [e.target.value] : []); renderText(); }
    if (e.target.id === "mechbtn") { state.mech = e.target.checked; store.set("mech", state.mech); syncText(); }
  });
  $("#gq").addEventListener("input", (e) => { state.gq = e.target.value.trim(); renderGlossary(); });
  window.addEventListener("hashchange", route);
  let wasNarrow = narrow();
  window.addEventListener("resize", () => { setNavH(); if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (state.tab === "text") placePanel(); } });

  $("#foot").innerHTML = `King James Margin Edition, pilot run. An independent experiment by Raymond Asogwa; principles adapted from the KJV Update Project, which is not affiliated. Base text: KJV 1769. Greek data: STEPBible, Tyndale House (CC BY 4.0). Not a release.`;
  route();
})();
</script>
