<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>KJME Margin Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an editor's desk. Decisions first, as a one-at-a-time review with the options set as
   finished verses; the full text second, as a reading column with its margin beside it. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --raised: #fafbfc; --ink: #15171c; --muted: #575d69; --faint: #858b96; --line: #dfe2e8; --line-strong: #c9ced7;
  --rubric: #a1202a; --rubric-soft: #f9e8e9; --rubric-ink: #7d1820;
  --edit: #fbebbc; --edit-ink: #4f3a00; --mech: #e8ebf0; --del: #b0414a;
  --cat-shifted: #b25205; --cat-archaic: #1c5ea6; --cat-syntax: #6a3cad; --cat-spelling: #0e7268; --cat-other: #575d69;
  --ok: #1d7748; --ok-soft: #e2f2e9; --warn: #8f5500; --warn-soft: #fbf0db;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #1a1d22; --raised: #1f2329; --ink: #e9ebef; --muted: #a5abb6; --faint: #757c88; --line: #2b2f37; --line-strong: #3a3f49;
  --rubric: #ee8088; --rubric-soft: #3b1d21; --rubric-ink: #f6b3b8;
  --edit: #4b3a0e; --edit-ink: #f7dd94; --mech: #262a31; --del: #f08e95;
  --cat-shifted: #f2a45d; --cat-archaic: #80b3f0; --cat-syntax: #ba9bf1; --cat-spelling: #60d1c3; --cat-other: #a5abb6;
  --ok: #70d4a0; --ok-soft: #163225; --warn: #f2be65; --warn-soft: #392b12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d22; --raised: #1f2329; --ink: #e9ebef; --muted: #a5abb6; --faint: #757c88; --line: #2b2f37; --line-strong: #3a3f49;
  --rubric: #ee8088; --rubric-soft: #3b1d21; --rubric-ink: #f6b3b8;
  --edit: #4b3a0e; --edit-ink: #f7dd94; --mech: #262a31; --del: #f08e95;
  --cat-shifted: #f2a45d; --cat-archaic: #80b3f0; --cat-syntax: #ba9bf1; --cat-spelling: #60d1c3; --cat-other: #a5abb6;
  --ok: #70d4a0; --ok-soft: #163225; --warn: #f2be65; --warn-soft: #392b12; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans) }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button, input { font: inherit; color: inherit }
button { cursor: pointer }
button:disabled { cursor: default; opacity: .45 }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px }
a { color: var(--rubric) }
.mono { font-family: var(--mono); font-size: 12.5px }
h1, h2, h3 { text-wrap: balance }

/* ---------- masthead ---------- */
.mast { padding-block: 22px 0; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; justify-content: space-between }
.brand { display: flex; gap: 14px; align-items: center; min-width: 0 }
.seal { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 9px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 600 15px/1 var(--serif); letter-spacing: .02em }
.brand h1 { font: 600 24px/1.15 var(--serif); margin: 0 }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px }
.verify { display: inline-flex; gap: 6px; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; vertical-align: 1px }
.verify.ok { background: var(--ok-soft); color: var(--ok) } .verify.bad { background: var(--warn-soft); color: var(--warn) }
.stats { display: flex; flex-wrap: wrap; gap: 6px 24px; font-variant-numeric: tabular-nums }
.stat b { display: block; font: 600 19px/1.1 var(--sans) }
.stat span { color: var(--faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em }

/* ---------- navigation ---------- */
nav.tabsbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 16px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none }
.tabs button { border: 0; background: none; padding: 12px 12px 11px; min-height: 44px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink) }
.count { font: 600 11.5px/1 var(--sans); padding: 3px 7px; border-radius: 999px; background: var(--mech); color: var(--muted) }
.count.hot { background: var(--rubric); color: var(--surface) }
@media (max-width: 760px) { nav.tabsbar { position: static } }

main { padding-block: 24px 80px }
.pill { font: 500 11.5px/1 var(--sans); padding: 4px 8px; border-radius: 999px; background: var(--mech); color: var(--muted); white-space: nowrap }
.pill.red { background: var(--rubric-soft); color: var(--rubric) } .pill.rec { background: none; border: 1px solid var(--ink); color: var(--ink) } .pill.green { background: var(--ok-soft); color: var(--ok) } .pill.amber { background: var(--warn-soft); color: var(--warn) }
.empty { color: var(--muted) }
.eyebrow { font: 600 11.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint) }

/* ---------- decisions ---------- */
.desk { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; align-items: start }
@media (max-width: 900px) { .desk { grid-template-columns: minmax(0, 1fr) } }
.queue { position: sticky; top: calc(var(--navh, 45px) + 16px); display: flex; flex-direction: column; gap: 12px }
@media (max-width: 900px) { .queue { position: static } }
.progress { display: flex; flex-direction: column; gap: 6px }
.progress .track { height: 6px; border-radius: 3px; background: var(--mech); overflow: hidden }
.progress .fill { display: block; height: 100%; background: var(--ink); transition: width .2s }
.progress .txt { font-size: 13px; color: var(--muted) }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.qitem { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 10px }
.qitem[aria-current="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink) }
.qitem .mark { grid-row: 1 / 3; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font: 600 11px/1 var(--sans); margin-top: 1px }
.qitem.done .mark { background: var(--ink); border-color: var(--ink); color: var(--surface) }
.qitem .p { font-weight: 600; font-size: 13.5px }
.qitem .s { color: var(--muted); font-size: 12.5px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.qlist-mobile { display: none } .out.out-mobile { display: none }
@media (max-width: 900px) { .out.out-desk { display: none } .out.out-mobile { display: flex } }
@media (max-width: 900px) { .qlist { display: none } .qlist-mobile { display: flex; gap: 8px; align-items: center; justify-content: space-between } }
.out { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px }
.out .btns { display: flex; flex-wrap: wrap; gap: 6px }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 40px; font-weight: 500 }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface) }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px }

.decision { display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.decision h2 { font: 600 30px/1.2 var(--serif); margin: 6px 0 0; letter-spacing: -.01em }
@media (max-width: 560px) { .decision h2 { font-size: 24px } }
.lede { font-size: 16px; line-height: 1.65; color: var(--ink); max-width: 68ch; margin: 0 }
.callout { border-radius: var(--r); padding: 12px 14px; font-size: 14px; line-height: 1.55; max-width: 72ch }
.callout.amber { background: var(--warn-soft); color: var(--ink) } .callout.amber b { color: var(--warn) }
.callout.plain { background: var(--surface); border: 1px dashed var(--line-strong) }

.options { display: flex; flex-direction: column; gap: 14px }
.opt { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0 }
.opt.chosen { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) }
.opt-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 14px 16px 0 }
.letter { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px; background: var(--mech); display: grid; place-items: center; font: 600 15px/1 var(--serif) }
.opt.chosen .letter { background: var(--ink); color: var(--surface) }
.opt-title { font: 600 16px/1.35 var(--sans); flex: 1 1 260px; min-width: 0 }
.opt-title .arrow { color: var(--faint); font-weight: 400 }
.opt-title s { color: var(--muted); text-decoration-thickness: 1.5px }
.opt-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px }
.reads { display: flex; flex-direction: column; gap: 10px }
.reads .lbl { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin-bottom: 5px; display: block }
.reads .vrow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px }
.reads .vref { font: 500 12px/2.4 var(--sans); color: var(--faint); text-align: right; font-variant-numeric: tabular-nums }
.reads .verse-text { font: 400 19px/1.65 var(--serif); border-left: 3px solid var(--line); padding: 2px 0 2px 14px }
.rec-why { font-size: 13.5px; color: var(--ink); margin: 0; padding: 8px 10px; background: var(--raised); border-radius: 6px }
.opt.chosen .reads .verse-text { border-left-color: var(--ink) }
.also { font-size: 13.5px; color: var(--muted); margin: 0 }
.also b { color: var(--ink); font-weight: 500 }
.flag { font-size: 13.5px; line-height: 1.5 }
.flag summary { cursor: pointer; color: var(--rubric); font-weight: 500; min-height: 30px; display: flex; align-items: center; gap: 6px }
.flag ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 6px }
.opt-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--raised) }
.opt-foot .who { font-size: 13px; color: var(--muted) }
.choose { min-height: 42px; padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--surface); font-weight: 600 }
.opt.chosen .choose { background: var(--ink); border-color: var(--ink); color: var(--surface) }
.dnav { display: flex; justify-content: space-between; gap: 10px; padding-top: 6px }
.tech summary { cursor: pointer; color: var(--faint); font-size: 13px; min-height: 30px; display: flex; align-items: center }
.tech p { font-size: 13px; color: var(--muted); margin: 6px 0 0 }

/* ---------- shared text marks ---------- */
.it { font-style: italic }
.chg, .ins.edit, .ins { background: var(--edit); color: var(--edit-ink); border-radius: 3px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone }
.del { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; margin-right: 4px; font-size: .9em }
.ins.mech { background: none; color: inherit; padding: 0; border-bottom: 1.5px dotted var(--faint); border-radius: 0 }
.del.mech { opacity: .65 }
.chg-k { text-decoration: underline dotted var(--muted); text-decoration-thickness: 1.5px; text-underline-offset: 4px }
.show-mech .mech, .show-mech .mech-k { background: var(--mech); border-radius: 3px }
sup.pl { font: 600 9.5px/1 var(--sans); color: var(--muted); margin-left: 1px; letter-spacing: .02em }
.flash { outline: 2px solid var(--ink); outline-offset: 1px; border-radius: 3px }

/* ---------- text ---------- */
.tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 7px 12px; min-height: 38px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--muted); min-height: 34px; display: inline-flex; gap: 6px; align-items: center }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 500 }
@media (max-width: 760px) { .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100% } .chip { flex: 0 0 auto } }
.search { flex: 1 1 200px; min-width: 0; max-width: 300px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 11px; min-height: 38px }
@media (max-width: 760px) { .search { max-width: none } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; margin-bottom: 6px }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 410px); gap: 28px; align-items: start }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr) } .margin-col { display: none } }
.chapnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px }
.chapnav a { text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font-size: 13px; background: var(--surface) }
h2.chapter { font: 600 12.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .13em; color: var(--muted); margin: 26px 0 8px; scroll-margin-top: calc(var(--navh, 45px) + 16px) }
.verse { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 8px; padding: 9px 10px 9px 4px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer; scroll-margin-top: calc(var(--navh, 45px) + 16px) }
.verse:hover { background: var(--surface) }
.verse.sel { background: var(--surface); border-color: var(--line-strong) }
.verse.waiting { position: relative }
.verse.waiting::before { content: ""; position: absolute; left: -8px; top: 0; bottom: 0; width: 2px; background: var(--rubric) }
.vmeta { align-items: center }
.vnum { font: 500 12px/2.25 var(--sans); color: var(--faint); text-align: right; font-variant-numeric: tabular-nums }
.vtext { font: 400 18px/1.7 var(--serif); min-width: 0 }
.vmeta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px }
.parallel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px }
.parallel .k { color: var(--muted) }
.parallel .lbl { font: 600 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); display: block; margin-bottom: 4px }
@media (max-width: 560px) { .parallel { grid-template-columns: minmax(0, 1fr) } }

.margin-col { position: sticky; top: calc(var(--navh, 45px) + 16px); max-height: calc(100vh - var(--navh, 45px) - 32px); overflow-y: auto; overscroll-behavior: contain }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.inline-panel { grid-column: 1 / -1; margin: 8px 0 4px; cursor: default }
.panel h3 { font: 600 20px/1.2 var(--serif); margin: 0 }
.panel h4 { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin: 0 0 8px }
.phead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
.sub { color: var(--muted); font-size: 13px; margin-top: 3px }
.navbtns { display: flex; gap: 6px }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; min-width: 36px; min-height: 36px; color: var(--muted) }
.chlist { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none }
.ch { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; cursor: pointer }
.ch .words { font: 400 16px/1.4 var(--serif) } .ch .words s { color: var(--muted) }
.ch .why { color: var(--muted); font-size: 13.5px }
.cat { font: 600 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .09em; color: var(--c, var(--cat-other)); display: inline-flex; gap: 6px; align-items: center }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--cat-other)); display: inline-block }
.cat-shifted_meaning { --c: var(--cat-shifted) } .cat-archaic_word { --c: var(--cat-archaic) } .cat-syntax { --c: var(--cat-syntax) } .cat-spelling { --c: var(--cat-spelling) }
.gl { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px }
details.more { font-size: 13.5px }
details.more summary { cursor: pointer; color: var(--muted); min-height: 30px; display: flex; align-items: center }
details.more .ev { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13.5px; margin: 0 }
.kv dt { color: var(--faint) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.rationale { font-size: 14px; line-height: 1.6; background: var(--bg); padding: 10px 12px; border-radius: 6px; margin: 8px 0 0 }
.cand { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px }
.cand.win { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok) }
.cand .who { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px }
.cand .txt { font: 400 15.5px/1.55 var(--serif) }
.cands { display: flex; flex-direction: column; gap: 8px }
.gate { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 4px; background: var(--ok-soft); color: var(--ok) }
.gate.fail { background: var(--rubric-soft); color: var(--rubric) }
.note { font-size: 13px; color: var(--muted); margin: 0; padding-left: 10px; border-left: 2px solid var(--line) }
.pending-box { background: var(--rubric-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px }
.pending-box .q { font: 500 15px/1.5 var(--sans); color: var(--rubric-ink) }

/* ---------- glossary and run ---------- */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--faint) }
td.serif { font: 400 15px/1.4 var(--serif) }
.st { font: 500 11.5px/1 var(--sans); padding: 3px 7px; border-radius: 999px; background: var(--mech); color: var(--muted) }
.st.ratified { background: var(--ok-soft); color: var(--ok) } .st.provisional { background: var(--warn-soft); color: var(--warn) }
.cards { display: flex; flex-direction: column; gap: 16px; max-width: 900px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.card h3 { margin: 0; font: 600 19px/1.25 var(--serif) }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px }
.bars { display: flex; flex-direction: column; gap: 8px }
.barrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 30px; gap: 10px; align-items: center; font-size: 13.5px; font-variant-numeric: tabular-nums }
.barrow .track { height: 10px; background: var(--mech); border-radius: 5px; overflow: hidden }
.barrow .fill { display: block; height: 100%; background: var(--rubric) }
footer { color: var(--faint); font-size: 12.5px; padding-block: 24px; border-top: 1px solid var(--line) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
</style>

<header class="wrap mast">
  <div class="brand">
    <div class="seal" aria-hidden="true">KJ</div>

<script>
const DATA = {"decisions":[{"batch":"PHP.2.b01","status":"resolved","resolved_by":"Raymond Asogwa","resolution":"PHP.2.b01.mechanical","passage":"Philippians 2:1–8","focus":"2:1–8","verses":["PHP.2.1","PHP.2.6","PHP.2.8"],"focus_verses":["PHP.2.6","PHP.2.8"],"question":"Should \"robbery\" stay in 2:6, and should \"unto death\" stay in 2:8?","context":"In 2:6 the KJV says Christ \"thought it not robbery to be equal with God\". Two translators replaced \"robbery\" with \"something to grasp\" or \"something grasped\", which is how modern versions read the Greek; this edition's rules forbid taking new wording from the Greek, so the auditor rejected both. In 2:8, \"obedient unto death\" means obedient to the point of dying; the auditor rejected \"obedient to death\" because it can be misread as obeying death itself. The reviewers objected to every option here, including keeping the KJV words, which also leaves \"bowels\" unchanged in 2:1.","why":"Keeping the KJV wording is the safest choice available. It changes nothing the rules protect, but 2:1 keeps \"bowels\" for now.","rerun":"The best text would combine \"affection\" in 2:1 with \"robbery\" and \"unto death\" kept. No translator produced that combination; ask Claude to re-run this passage to get it.","technical":"Should PHP.2.8 keep 'obedient unto death' (unto = degree, μέχρι, outside g-unto-to), and should PHP.2.6 keep 'robbery' in its active AV sense, or change it to 'something to grasp' (the RV passive sense)?","trigger":"no_eligible_candidate; escalate_only term 'robbery'; glossary sense conflict for 'unto' (degree)","options":[{"ids":["PHP.2.b01.mechanical"],"choose":"PHP.2.b01.mechanical","authors":["mechanical"],"recommended":true,"eligible":false,"failed_checks":true,"review_fails":["scorer","auditor"],"fail_notes":[{"reviewer":"scorer","note":"PHP.2.1: 'bowels' not updated per glossary g-bowels-affection (G5, R4)"},{"reviewer":"scorer","note":"PHP.2.8: 'unto' not updated per ratified glossary g-unto-to (G5  for a modern reader, failing R4 and P1 (G1)."},{"reviewer":"scorer","note":"PHP.2.23: 'presently' left unchanged in the same shifted sense; R4 requires the change, so G1 fails here as well."},{"reviewer":"auditor","note":"PHP.2.23: 'presently' is kept. In the KJV, 'presently' means at once (MAT.21.19, MAT.26.53, 1SA.2.16; L-mw7uocr7-6l). A modern reader takes it as 'soon' or 'currently'. Keeping a shifted-meaning word fails G1 (R4, P1). The words 'so soon as' only say when Timotheus will be sent. They do not carry the 'at once' sense."},{"reviewer":"auditor","note":"PHP.2.20: 'naturally' is kept. If the 1611 sense is 'genuinely', this is also an R4 risk. This is not settled (see A), so the G1 failure rests on PHP.2.23 alone."}],"focus_changes":[],"other_changes":[{"from":"unto","to":"to","verse":"PHP.2.19"}],"keeps_kjv":true,"verses":{"PHP.2.19":{"text":"But I trust in the Lord Jesus to send Timotheus shortly to you, that I also may be of good comfort, when I know your state.","runs":[{"t":"But I trust in the Lord Jesus to send Timotheus shortly "},{"t":"unto","c":"del"},{"t":"to","c":"ins"},{"t":" you, that I also may be of good comfort, when I know your state."}],"changes":[{"from":"unto","to":"to"}]},"PHP.2.20":{"text":"For I have no man likeminded, who will naturally care for your state.","runs":[{"t":"For I have no man likeminded, who will naturally care for your state."}],"changes":[]},"PHP.2.23":{"text":"Him therefore I hope to send presently, so soon as I shall see how it will go with me.","runs":[{"t":"Him therefore I hope to send presently, so soon as I shall see how it will go with me."}],"changes":[]}}},{"ids":["PHP.2.b05.mechanical"],"choose":"PHP.2.b05.mechanical","authors":["mechanical"],"recommended":false,"eligible":false,"failed_checks":false,"review_fails":["scorer","auditor"],"fail_notes":[{"reviewer":"scorer","note":"PHP.2.19: 'unto' left unchanged although ratified glossary entry g-unto-to requires 'to' (G5, R3, P7)."},{"reviewer":"scorer","no s 'meet' in PHP.1.7. I overrule the scorer's ranking (minimalist 1.0 over clarity 0.96, rev-2-mw7trs6z-h) for three reasons from the auditor (rev-2-mw7trq3j-g). First, the minimalist candidate's 'right' rests only on the Greek gloss δίκαιον, which R12 does not allow as a source of wording and P5 does not allow as a reason for a rendering. Second, 'right' adds a moral connotation (just) that 'meet' does not carry in its other KJV uses. Third, G1 and P1 count connotation as part of meaning, and P1 wins over the small difference in the scorer's numbers. The KJV's own uses (JOB.34.31, 2TH.1.3; lookups L-mw7try7h-j and L-mw7trd3m-f) all mean 'fitting, proper', so the clarity candidate's 'fitting' keeps the 1611 sense in one word of the same part of speech, as R3 asks. I propose 'meet → fitting' as a new entry filed as archaic_word, not shifted_meaning: the auditor judged 'meet' to be an archaic adjective rather than a word whose meaning has shifted, so the margin will show this category instead of the candidate's label.","debate":{"ran":true,"triggers":["top_differs","close_scores"]},"eligible":["PHP.1.b01.cadence","PHP.1.b01.clarity","PHP.1.b01.minimalist","PHP.1.b01.mechanical"],"supersedes":null,"at":"2026-11-08T12:45:32.668Z"},"reviews":[{"reviewer":"reviewer-scorer","round":2,"id":"rev-2-mw7trs6z-h","summary":"A wins: it makes only the changes the rules call for and its 'meet' -> 'right' update in 1.7 keeps the KJV's 'fitting' sense in one word with the original cadence, edging out C's equally correct but heavier 'fitting'. B and M stay eligible but leave 'meet' unreadable to a modern reader.","candidates":{"PHP.1.b01.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":5,"S3":5,"S4":5},"weighted":1,"notes":["PHP.1.2: unto -> to follows glossary entry g-unto-to (R3; g-unto-to is 'proposed', so G5 is not binding, but following it is correct and the candidate would need to propose it)","PHP.1.7: meet -> right preserv would render that change as 'test things that are excellent' rather than 'prove', which is clearer to a modern reader without touching the KJV cadence.","candidates":{"PHP.1.b02.cadence":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":4,"S2":5,"S3":4,"S4":5},"weighted":0.88,"notes":[],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4: the KJV sense of 'record' here is testimony/witness; 'witness' preserves that sense for a modern reader."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R4 and g-bowels-affection: the affective sense must not be read as entrails."},{"change_id":"c3","verdict":"alternative","alternative_text":"test","reason":"R4/P1 support changing 'approve' here, because the KJV sense is 'to test and appraise' (compare KJV 'prove all things' in 1 Thess.5.21 for the same sense), which a modern reader would take as 'endorse'. But R3 asks for the closest modern equivalent, and 'prove things that are excellent' reads as 'demonstrate', not 'test'; 'test things that are excellent' carries the KJV sense in plain modern English."},{"change_id":"c6","verdict":"agree","alternative_text":null,"reason":"R3 and g-unto-to: 'unto' in this directional sense updates to 'to'."}]},"PHP.1.b02.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":4,"S2":4,"S3":5,"S4":5},"weighted":0.86,"notes":["PHP.1.10: 'approve' kept. This passes G1 only if the modern sense ('endorse, accept') is taken as close enough to the KJV sense ('test, appraise'); a reader who takes it as endorsement gets a different meaning (R4/P1). I therefore dock S1 and S2 rather than fail the gate, and I mark the point for the meaning auditor and coordinator to settle (R4: if the sense cannot be settled from the English, mark it uncertain and escalate).","PHP.1.8: 'long after' kept. 'How greatly I long after you all' is still intelligible in context, so I do not fail G1, but it is an R4 candidate: a modern reader may take 'long after' temporally, and C's 'long for' is the plainer wording."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4: 'record' as witness is an obsolete sense and must change; the JOB.16.19 parallel is good support."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R4 and g-bowels-affection: 'affection' for the seat of tender feeling is right."},{"change_id":"c5","verdict":"agree","alternative_text":null,"reason":"R3 and g-unto-to applied to the directional sense."}]},"PHP.1.b02.clarity":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.1.8: 'record' kept. R4/P1: in this verse the KJV noun means 'witness, testimony', not a written account; a modern reader would take 'record' in its modern sense, so the meaning changes. It must be updated (as in A and B)."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4: 'long after' in the KJV idiom means 'yearn for', and 'long for' preserves that sense; the change is optional under P2 but improves the verse."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"R4: 'approve' in the KJV here is 'to test/appraise'; 'test' carries that sense better than 'prove'. Flagging it uncertain is the right procedure under R4 and is not the cause of this candidate's failure."}]},"PHP.1.b02.mechanical":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.1.8: 'record' kept — R4/P1: the KJV sense is 'witness, testimony'; a modern reader reads a written record. Meaning changes.","PHP.1.8: 'bowels' kept — R4/P1 and g-bowels-affection: the KJV sense is the seat of tender feeling; modern 'bowels' means entrails, so the verse means something different to a modern reader.","PHP.1.10: 'approve' kept — R4: the KJV sense is 'to test/appraise'; the modern sense ('endorse') is a different meaning."],"comments":[]}}},{"reviewer":"reviewer-meaning-auditor","round":2,"id":"rev-2-mw7tuh8f-1h","summary":"A is the only candidate that passes every gate. Its 'record' → 'witness' change is supported by the KJV's own English (JOB.16.19), and it rightly keeps 'approve'. B and C fail G1 because they change 'approve' on the Greek gloss alone (B also keeps the shifted word 'record'), and M fails G1 for keeping 'bowels' and 'record' and G5 for keeping 'unto'.","candidates":{"PHP.1.b02.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.1.8: 'record' → 'witness' keeps the meaning (R4). The KJV's own English supports it: JOB.16.19 sets 'my witness is in heaven' beside 'my record is on high' (L-mw7ttwe6-1f). So the change does not rest only on the Greek gloss (R12).","PHP.1.8: 'bowels' → 'affection' keeps the sense of tender feeling and matches the proposed entry g-bowels-affection (R4).","PHP.1.10: 'approve' kept. The KJV's other uses of 'approve' (PSA.49.13, 1CO.16.3; L-mw7ttwe2-1e) mean esteem or sanction, so keeping it keeps the KJV sense. It also leaves the verse open to the same readings the KJV allows.","PHP.1.10: 'sincere' and 'without offence' kept. 'Sincere' (pure) is slightly narrower in modern use, but not a misreading that triggers R4. 'Without offence' keeps the KJV's ambiguity: not giving offence, or not stumbling.","G2 to G4 copied from the check report. G5 passes because 'unto' follows the provisional entry g-unto-to."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4: JOB.16.19 (L-mw7ttwe6-1f) shows that KJV 'record' can mean the person who testifies. A modern reader would take it as a written account."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R4, g-bowels-affection: keeps the affective sense. The literal sense does not apply here."},{"change_id":"c5","verdict":"agree","alternative_text":null,"reason":"g-unto-to: same meaning."}]},"PHP.1.b02.clarity":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.1.10: 'approve' → 'test' fails G1 (P1, P5, R12). The KJV's own uses of 'approve' mean esteem or sanction (PSA.49.13, 1CO.16.3; L-mw7ttwe2-1e). The only support offered is the δοκιμάζειν gloss. 'Test' also removes the sense of esteeming the excellent things, so it settles an ambiguity the KJV leaves open.","PHP.1.8: 'record' kept. In 'God is my record' the KJV sense is 'witness' (JOB.16.19, L-mw7ttwe6-1f), and a modern reader would take it as a written account. Keeping a shifted-meaning word is also a G1 failure (R4). The other review missed this.","PHP.1.8: 'long after' → 'long for' keeps the meaning, although the reason given for it is wrong."],"comments":[{"change_id":"c3","verdict":"disagree","alternative_text":null,"reason":"P1/P5, R12: Greek-gloss evidence cannot move the text away from the KJV's English sense, and 'test' drops the sense of approving. Keep 'approve'."},{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"Same meaning: both mean yearn for. Whether it is needed is a minimality question, not a meaning one."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R4, g-bowels-affection."},{"change_id":"c6","verdict":"agree","alternative_text":null,"reason":"g-unto-to."}]},"PHP.1.b02.cadence":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.1.10: 'approve' → 'prove' fails G1 (P1, P5, R12). It rests only on the δοκιμάζειν gloss, against how the KJV uses 'approve' elsewhere (L-mw7ttwe2-1e). Modern 'prove' reads as 'demonstrate', which creates a new misreading and drops the sense of esteem."],"comments":[{"change_id":"c3","verdict":"disagree","alternative_text":null,"reason":"P1/P5, R12: this follows the Greek rather than updating the KJV English, and adds a modern misreading. Keep P.1.b03","verses":["PHP.1.12","PHP.1.13","PHP.1.14","PHP.1.15","PHP.1.16","PHP.1.17"],"decision":{"id":"D-mw7txjal-26","outcome":"merge","winner":null,"winner_author":null,"decided_by":"coordinator","confidence":0.72,"rationale":"Both final-round reviews rank the minimalist text first (rev-2-mw7twgv5-21, rev-2-mw7twy8i-24), and it is identical to the cadence text. The mechanical draft is not eligible, because both reviewers fail it on G5 for leaving g-unto-to unapplied. Both reviewers mark clarity's c8 (waxing → growing) as 'agree' under R3, and no one disagrees. Keeping 'waxing', a word modern readers no longer use, leaves a barrier that the rules say to remove. So I merged the minimalist base with c8. I did not merge clarity's 'I wish you to understand': the scorer found the infinitive optional under R5/P2, and the only alternative offered, 'I wish you should understand', would leave a partial and awkward construction. So v12 keeps the KJV wording per R11, and I propose that KEEP for later review.","debate":{"ran":true,"triggers":["top_differs","close_scores"]},"eligible":["PHP.1.b03.cadence","PHP.1.b03.clarity","PHP.1.b03.minimalist","PHP.1.b03.mechanical"],"supersedes":null,"at":"2026-11-08T12:49:41.615Z"},"reviews":[{"reviewer":"reviewer-scorer","round":2,"id":"rev-2-mw7twgv5-21","summary":"A and B carry identical text, pass every gate and apply the provisional 'unto' → 'to' and 'brethren' → 'brothers' entries while leaving still-understood KJV wording such as 'palace', 'waxing confident' and 'The one preach' untouched (P2, P3); between the two identical texts I rank A first only arbitrarily, and no rule distinguishes them. C is eligible but loses on minimality because it restructures 'I would you should understand' beyond what R5 requires. M fails G5 by leaving 'unto' and 'brethren' unchanged despite the provisional glossary entries.","candidates":{"PHP.1.b03.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":4,"S adence candidate is not eligible after its G1 failure on 'earnest' → 'eager' (P5, R12).","debate":{"ran":true,"triggers":["gate_G1_PHP.1.b04.cadence"]},"eligible":["PHP.1.b04.clarity","PHP.1.b04.minimalist","PHP.1.b04.mechanical"],"supersedes":null,"at":"2026-11-08T12:51:55.003Z"},"reviews":[{"reviewer":"reviewer-scorer","round":2,"id":"rev-2-mw7tzq0p-2q","summary":"C wins: it makes only the glossary-mandated 'wot' → 'know' change, leaving every other word a modern reader still understands exactly as the KJV meant it (P2, S1 = 5). A is second because its 'notwithstanding' → 'nevertheless' is a defensible R4 sense-clarification that preserves the KJV concessive sense, and B is third because its untagged American spellings ('pretense', 'labor') conflict with the accepted British-form neighbouring batches (S4/P7).","candidates":{"PHP.1.b04.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":4,"S2":5,"S3":4,"S4":5},"weighted":0.88,"notes":[],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4/P1: in this concessive use 'notwithstanding' means 'however', a sense a modern reader may not reliably assign; the lookup supports the concessive sense and 'nevertheless' carries it with the same cadence (P3)."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R3 and glossary g-wot-know; 'wot' is no longer in common use and the entry fixes the update as 'know'."}]},"PHP.1.b04.cadence":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":3,"S2":5,"S3":4,"S4":2},"weighted":0.74,"notes":[],"comments":[{"change_id":"c1","verdict":"disagree","alternative_text":"pretence","reason":"R10 routes spelling changes through glossary entries, and none exists for 'pretence'; the accepted neighbouring batches (PHP.1.b02, b03) keep British forms such as 'defence', so Americanizing here breaks P7/S4 consistency with no clarity gain (P2)."},{"change_id":"c2","verdict":"agr  clarity's c2 for three reasons. First, 'which you ... now hear to be in me' puts an object before an infinitive, a pattern modern English still uses ('which I believe to be true'), so it does not block understanding as R5 requires; P2 outranks clarity. Second, c2 adds a pronoun that refers back inside a relative clause ('which you ... hear that it is in me'), which is not standard English, and it leaves R6 italic inheritance unresolved. Third, the S4 argument relies on b04/b05, but those changes were word and verb-form updates ('wot', 'becometh'), not syntax. That leaves minimalist and cadence, which have identical text and change logs, and I chose minimalist because its notes record the R4 sense of 'suffer' and the R6 italics, as R11 asks.","debate":{"ran":true,"triggers":["top_differs","close_scores"]},"eligible":["PHP.1.b06.cadence","PHP.1.b06.clarity","PHP.1.b06.minimalist","PHP.1.b06.mechanical"],"supersedes":null,"at":"2026-11-08T12:55:20.813Z"},"reviews":[{"reviewer":"reviewer-scorer","round":2,"id":"rev-2-mw7u44yu-3z","summary":"A wins because it is the only eligible candidate that also resolves the one genuinely archaic construction in the batch, 'hear to be in me', under R5 while preserving the KJV sense and staying consistent with the modernization of comparable constructions in accepted batches. B and C are correct but minimal, leaving that construction hard for a modern reader to parse. M is ineligible: it fails G5 by leaving 'unto' against a ratified glossary entry.","candidates":{"PHP.1.b06.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":4,"S2":5,"S3":4,"S4":5},"weighted":0.88,"notes":["PHP.1.30: c2 preserves the KJV sense ('hear [the same conflict] to be in me') and adds no meaning; the supplied italic 'to be' is replaced by a supplied clause of the same sense, consistent with R6.","PHP.1.30: c2 note — the supplied 'that it is' would ideally carry the italics of the 'to be' it replaces (R6); this is a rendering detail, not a gate failure.","Code gates G2-G4 in check_report accepted as correct; no errors seen."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R3/P7: ratified glossary g-unto-to requires 'to' here."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R5: 'hear to be in me' is an elliptical construction a modern reader cannot readily parse; 'hear that it is in me' keeps the subject and sense, and the cited lookup supports the sense. Word growth is within R9's limit."}]},"PHP.1.b06.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":3,"S3":4,"S4":4},"weighted":0.82,"notes":["Check report code gates (G2-G4) accepted as correct; no errors seen."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R3/P7: ratified glossary g-unto-to requires 'to' here."},{"change_id":"c2","verdict":"disagree","alternative_text":"now hear that it is in me","reason":"R5: 'hear to be in me' with supplied italics does not readily parse in modern English; the subject of the infinitive must be inferred. Leaving it unchanged also diverges from the modernization of comparable constructions in accepted batches b04-b05 ('becometh', 'wot not'), against P7/S4."}]},"PHP.1.b06.cadence":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":3,"S3":4,"S4":4},"weighted":0.82,"notes":["Check report code gates (G2-G4) accepted as correct; no errors seen."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R3/P7: ratified glossary g-unto-to requires 'to' here."},{"change_id":"c2","verdict":"disagree","alternative_text":"now hear that it is in me","reason":"R5: same reason as for B — 'hear to be in me' blocks straightforward modern reading and is inconsistent with accepted batches b04-b05."}]},"PHP.1.b06.mechanical":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"fail"},"sco .","candidates":{"PHP.2.b01.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":3,"S2":4,"S3":3,"S4":4},"weighted":0.68,"notes":["PHP.2.8: c5 'fashion'→'appearance' is a defensible R4 sense-change but optional under P2 and priced into S1; code G2-G4 report accepted unchanged.","PHP.2.6: c4 'something grasped' leaves the clause awkward; see change comment."],"comments":[{"change_id":"c4","verdict":"alternative","alternative_text":"something to grasp","reason":"R4/P3: 'thought it not something grasped to be equal with God' is awkward and reads as a noun phrase in the wrong place; 'something to grasp' carries the same KJV sense (a thing to be seized, not theft) in a readable clause."},{"change_id":"c5","verdict":"disagree","reason":"P2/R11: 'found in fashion as a man' is still readily read as 'in appearance' by a modern reader; the change is optional and not required by R4, and keeping it preserves the KJV cadence (P3).","round2_changed":"yes"}]},"PHP.2.b01.cadence":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":4,"S2":4,"S3":4,"S4":4},"weighted":0.8,"notes":[],"comments":[{"change_id":"c4","verdict":"agree","reason":"R7/R4: escalate_only change correctly flagged uncertain for human review, and 'something to grasp' preserves the KJV sense of a thing to be seized rather than theft (P1, P5)."}]},"PHP.2.b01.minimalist":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.6: 'robbery' left unchanged - in modern English it means theft, while the KJV sense is 'something to be seized'; a modern reader takes away the wrong meaning (R4, P1). escalate_only licenses proposing a change with escalation (R7), which C does not do."],"comments":[{"change_id":"c4","verdict":"alternative","alternative_text":"something to grasp","reason":"R4/P1: 'robbery' must be addressed because its modern sense diverges from the KJV sense; propose 'something :{"id":"PHP.2.b04","verses":["PHP.2.17","PHP.2.18"],"decision":{"id":"D-mw7umgwj-55","outcome":"select","winner":"PHP.2.b04.cadence","winner_author":"translator-cadence","decided_by":"coordinator","confidence":0.86,"rationale":"All four candidates are eligible. Cadence, minimalist and mechanical have the same text and change log (only the mechanical ye → you). Applying the scorer's own round-2 correction (S2=3 for all three), each scores 0.88, so the 0.94 still listed for cadence is stale, and the tie is broken in favour of the scorer's top-ranked id. Clarity ranks last at 0.64. Both reviewers disagreed with its c1 ('be offered' → 'am offered'), which R5 and P2 do not require and which cites false evidence: σπένδομαι is tagged V-PPI-1S, which is indicative (R12). Its c2 and c3 ('joy' → 'rejoice') fall below the R3 threshold and give 'rejoice, and rejoice', breaking the cadence (P3). An occurrences lookup (L-mw7umagz-54) found no accepted KJME precedent for 'joy' as a verb, so a KEEP entry is proposed.","debate":{"ran":true,"triggers":["top_differs"]},"eligible":["PHP.2.b04.cadence","PHP.2.b04.clarity","PHP.2.b04.minimalist","PHP.2.b04.mechanical"],"supersedes":null,"at":"2026-11-08T13:09:04.915Z"},"reviews":[{"reviewer":"reviewer-scorer","round":2,"id":"rev-2-mw7ulttb-4x","summary":"B wins: it makes only the mechanical pronoun update the rules require, keeping the KJV's wording and its parallel 'I joy, and rejoice' cadence, while A adds two optional changes (a mood-flattening 'am offered' and a 'rejoice, and rejoice' repetition) that cost it on minimality and cadence.","candidates":{"PHP.2.b04.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":3,"S2":4,"S3":2,"S4":4},"weighted":0.64,"notes":["PHP.2.17: c1 'be offered' → 'am offered' preserves the conditional sense (G1), but R5 allows syntax change only where it blocks understanding, and 'if I be offered' does not; c1's evidence relies on the Greek subjunctive, which edges past P5 (English sense could be settled from the English conditional alone).","PHP.2.17/18: 'joy' → 'rejoice' is a permitted R3 change in principle, but as rendered it produces 'I rejoice, and rejoice with you all' and 'do you rejoice, and rejoice with me', which loses the KJV's parallel cadence (P3).","G2-G4 taken from the check report and correct; G5 consistent with g-yea-keep (KEEP) and the locked 'faith'."],"comments":[{"change_id":"c1","verdict":"disagree","reason":"R5 permits a syntax change only where archaic construction blocks understanding, and 'if I be offered' does not; P2 makes keeping the default and P3 keeps the KJV mood. The change is also not required by any rule."},{"change_id":"c2","verdict":"disagree","reason":"R3 threshold and P2: 'I joy, and rejoice' is comprehensible to a typical reader without a footnote because the paired 'rejoice' fixes the sense. Rendering it 'I rejoice, and rejoice' also breaks the parallel cadence (P3, R5: never restructure to read more smoothly)."},{"change_id":"c3","verdict":"agree","reason":"P7: if the verb is updated in v17, the same word in the same sense in v18 must be updated too."}]},"PHP.2.b04.cadence":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":4,"S3":5,"S4":5},"weighted":0.94,"notes":["G2-G4 taken from the check report and correct.","G5: 'Yea' kept per g-yea-keep (KEEP), 'faith' locked and untouched, text consistent with accepted batches PHP.2.b02/b03."],"comments":[]},"PHP.2.b04.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":3,"S3":5,"S4":5},"weighted":0.88,"notes":["G2-G4 taken from the check report and correct.","G5: 'Yea' kept per g-yea-keep; 'joy' left as verb with no ratified/provisional glossary entry requiring change; consistent with accepted neighbouring batches."],"comments":[]},"PHP.2.b04.mechanical":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":3,"S3":5,"S4":5},"weighted":0.88,"notes":["G2-G4 taken from the check report and correct.","G4: the sole diff ('ye' → 'you') is logged.","G5: 'Yea' kept per g-yea-keep."],"comments":[]}}},{"reviewer":"reviewer-meaning-auditor","round":2,"id":"rev-2-mw7um5h8-4z","summary":"All four candidates pass G1 and G2. A, B and M are the KJV with only the mechanical plural update, so the conditional mood and the open reading of 'do you joy' in v18 are kept. C keeps the meaning, but its c1 ('be' → 'am') is not needed and cites false evidence (the Greek verb is tagged V-PPI-1S, indicative), so I keep my disagreement on c1 and rank C last.","candidates":{"PHP.2.b04.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.17: the same as the KJV. 'Yea' is kept as g-yea-keep requires (G5). 'if I be offered' keeps the KJV's conditional mood (R5). The context 'upon the sacrifice' fixes 'offered' in its sacrificial sense, which matches ordinary KJV usage (lookup L-mw7uls6j-4t: GEN.8.20, GEN.31.54). So there is no shifted-meaning risk. 'your' and 'you all' are tagged plural (G2). 'faith' is unchanged (G3).","PHP.2.18: 'do you joy, and rejoice with me' keeps the KJV's do + subject + verb shape. It can still be read as an imperative or as a statement, so the ambiguity is kept (G1). 'you' is tagged plural (G2)."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R1: mechanical ye → you. The plural mark is kept (P4)."}]},"PHP.2.b04.cadence":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.17 and PHP.2.18: the text is the same as A. The meaning, mood and the v18 ambiguity are all kept. The plural marks match the pretags."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R1: mechanical ye → you. The plural mark is kept (P4)."}]},"PHP.2.b04.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.17: 'be offered' → 'am offered': the open condition still holds, and the time reference is still open (now or later). So the meaning does not change and G1 passes. But the evidence is false. The KJV's Greek σπένδομαι is tagged V-PPI-1S, which is indicative, not subjunctive (reference.original PHP.2.17 #4), so the citation does not support the claim (R12, P8). The change is also not needed under R5.","PHP.2.17: 'I joy' → 'I rejoice': the sense is the same. 'with you all' still marks the second verb as shared rejoicing (χαίρω versus συγχαίρω), so the distinction survives.","PHP.2.18: 'do you rejoice, and rejoice with me': the do + subject shape is kept, so the reading is still open between imperative and statement. The plural mark is kept."],"comments":[{"change_id":"c1","verdict":"disagree","alternative_text":"if I be offered","reason":"There is no G1 failure, but the change is not needed: 'if I be' does not block understanding (R5, P2). The evidence also misstates the source: the Greek is indicative (V-PPI-1S), not subjunctive (R12)."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"The meaning is kept: the verb 'joy' means rejoice. Whether the change is needed is a question for the scorer, not a meaning issue."},{"change_id":"c4","verdict":"agree","alternative_text":null,"reason":"R1: mechanical ye → you. The plural mark is kept (P4)."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"Same sense as c2, applied consistently (P7). The meaning and the v18 ambiguity are kept."}]},"PHP.2.b04.mechanical":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.17 and PHP.2.18: the text is the same as A and B. Only the mechanical pronoun update was made. The meaning does not change and the plural marks match."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R1: mec ere: 'presently' is still in common use but its modern sense ('currently') has shifted from the KJV sense ('at once', ἐξαυτῆς), and 'immediately' preserves that sense (P1)."},{"change_id":"c3","verdict":"agree","reason":"R1 mechanical, plural 'you'."},{"change_id":"c4","verdict":"agree","reason":"R2 mechanical, third-person singular 'has'."}]},"PHP.2.b05.cadence":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.20: 'naturally' left unchanged in a sense whose modern reading ('of course', 'by nature') differs from the KJV sense ('sincerely', γνησίως); keeping it changes the meaning for a modern reader, failing R4 and P1 (G1).","PHP.2.23: 'presently' left unchanged in the same shifted sense; R4 requires the change, so G1 fails here as well."],"comments":[{"change_id":"c1","verdict":"agree","reason":"R3 with ratified glossary g-unto-to."}]},"PHP.2.b05.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":5,"S3":4,"S4":4},"weighted":0.94,"notes":[],"comments":[{"change_id":"c1","verdict":"agree","reason":"R3 with ratified glossary g-unto-to."},{"change_id":"c2","verdict":"agree","reason":"R4: 'naturally' must change to keep the KJV sense 'sincerely' (P1)."},{"change_id":"c5","verdict":"agree","reason":"The text change itself is right ('immediately' for the KJV sense 'at once', R4), but the category is logged as archaic_word; 'presently' is still in common use, so the correct category is shifted_meaning (R4, P8). The category should be corrected before this candidate is merged."}]},"PHP.2.b05.mechanical":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"fail"},"scores":null,"weighted":null,"notes":["PHP.2.19: 'unto' left unchanged although ratified glossary entry g-unto-to requires 'to' (G5, R3, P7).","PHP.2.20: 'naturally' kept with a shifted modern sense, failing R4 and P1 (G1).","PHP.2.23: 'presently' kept with a shifted modern sense, failing R4 and P1 (G1)."],"comments":[]}}},{"reviewer":"reviewer-meaning-auditor","round":2,"id":"rev-2-mw7upbtr-6p","summary":"B and M fail G1 because they keep 'presently'. In the KJV it means 'at once' (MAT.21.19, MAT.26.53, 1SA.2.16), and modern readers take it as 'soon'. M also fails G5 on 'unto'. A and C have the same text and keep the meaning, but their 'naturally' → 'genuinely' change rests only on the Greek gloss, which it copies word for word. The English 1611 sources are missing and the only other KJV use (JUD.1.10) means 'by nature', so the change should be marked uncertain and escalated to the human editor under R4 and R12.","candidates":{"PHP.2.b05.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.20: 'naturally' → 'genuinely': passes G1 (R4/P1), but the support is weak. The English 1611 sources are not installed (L-mw7uob6z-6h), so the sense could not be settled from the English. The only other KJV occurrence (JUD.1.10, L-mw7uob73-6i) uses 'naturally' to mean 'by nature, by instinct'. The new word is copied word for word from the Greek gloss (G1104 'genuinely'; the definition says 'sincerely, honourably', L-mw7uocr7-6m). Under R4 the change should have been marked uncertain and escalated. It was not marked.","PHP.2.23: 'presently' → 'immediately': this keeps the meaning. In the KJV's own English, 'presently' means at once (MAT.21.19, MAT.26.53, 1SA.2.16; L-mw7uocr7-6l). The category is wrong: it should be shifted_meaning, not archaic_word. The text itself is correct.","PHP.2.19, PHP.2.21, PHP.2.22, PHP.2.24: tense, mood, agency and number are unchanged. The perfect 'has served' is kept.","G2 to G4 are copied from the check report. G5: the 'unto' entry is followed, and the 'which' and 'shall' KEEP entries are kept."],"comments":[{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R4/P1: the sense 'sincerely, with real care' is kept, and modern 'naturally' ('of course') would mislead. But R12: the only evidence is the Greek gloss, and the new word copies it. With no English-side check, the change should have been marked uncertain under R4. The coordinator should escalate it so a human can confirm the 1611 sense."},{"change_id":"c5","verdict":"agree","alternative_text":null,"reason":"R4/P1: in KJV usage 'presently' means at once (MAT.21.19, MAT.26.53; L-mw7uocr7-6l). The category should be shifted_meaning."}]},"PHP.2.b05.cadence":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.23: 'presently' is kept. In the KJV, 'presently' means at once (MAT.21.19, MAT.26.53, 1SA.2.16; L-mw7uocr7-6l). A modern reader takes it as 'soon' or 'currently'. Keeping a shifted-meaning word fails G1 (R4, P1). The words 'so soon as' only say when Timotheus will be sent. They do not carry the 'at once' sense.","PHP.2.20: 'naturally' is kept. If the 1611 sense is 'genuinely', this is also an R4 risk. This is not settled (see A), so the G1 failure rests on PHP.2.23 alone.","G2 to G4 are copied from the check report."],"comments":[]},"PHP.2.b05.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.20: 'naturally' → 'genuinely' has the same issue as in A. It passes G1, but the only evidence is the Greek gloss, and the new word copies it. The candidate's notes say plainly that the English sources were missing, but the change itself is not marked uncertain (R4). The coordinator should escalate it.","PHP.2.23: 'presently' → 'immediately' keeps the meaning (MAT.21.19, MAT.26.53; L-mw7uocr7-6l). The category, shifted_meaning, is correct.","G2 to G4 are copied from the check report. G5 is followed."],"comments":[{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R4/P1: the sense is kept. R12/R4: the sense was not settled from the English, so the change should be marked uncertain and escalated."},{"change onale":"Editor decision from the Margin Viewer.","supersedes":"D-mw7usvfh-84","at":"2026-11-08T16:25:21.645Z"},"reviews":[{"reviewer":"reviewer-scorer","round":1,"id":"rev-1-mw7urmra-7v","summary":"Candidate A is the only candidate that passes every gate: it applies the ratified 'unto'→'to' entry and makes the three R4 sense repairs the KJV requires ('wants'→'needs', 'carefully'→'eagerly', 'not regarding'→'not sparing'), while correctly leaving 'labour' and the non-agent 'of' constructions alone. B and C fail G1 by keeping 'carefully' (B) and 'not regarding his life' (B and C), whose modern senses differ from the KJV; M additionally fails G5 by keeping 'unto' against a ratified glossary entry.","candidates":{"PHP.2.b06.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":5,"S3":4,"S4":4},"weighted":0.94,"notes":["PHP.2.25 / PHP.2.26 / PHP.2.27 / PHP.2.28 / PHP.2.29 / PHP.2.30: G2–G4 taken from check report; no error seen.","PHP.2.26, 2.30: the flagged 'of' instances are not the agent after a passive verb (2.26 'heard that'; 2.30 'the work of Christ' is genitive), so provisional g-of-by does not apply; not applying it is correct under R3/G5.","PHP.2.25 'wants'→'needs' is required by R4 and does not alter the sense.","PHP.2.28 'carefully'→'eagerly' and 2.30 'regarding'→'sparing' are required by R4: the modern primary sense of each word differs from the KJV sense, so keeping them would change the meaning for a modern reader (P1).","PHP.2.29 'reputation'→'honor' is a defensible R4 change; the KJV sense (esteem/being held in honour) is preserved.","'labour' retained per g-labour-keep (KEEP)."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4/P1: 'wants' in the KJV sense is 'needs'; the modern sense 'desires' would change the meaning. Lookup evidence supports it."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"R3/G5: ratified g-unto-to applies in this sense."},{"change_id":"c4","verdict":"agree","alternative_text":null,"reason":"R4: KJV 'carefully' means with eagerness/zeal; 'eagerly' preserves the sense. 'earnestly' would be an equally acceptable rendering."},{"change_id":"c7","verdict":"agree","alternative_text":null,"reason":"R4: 'hold such in honour' preserves the KJV sense of esteem; 'in esteem' (as in C) is also acceptable."},{"change_id":"c8","verdict":"agree","alternative_text":null,"reason":"R3/G5: ratified g-unto-to applies."},{"change_id":"c9","verdict":"agree","alternative_text":null,"reason":"R4: 'not sparing his life' preserves the KJV sense ('not counting his life as important'), which modern 'regarding' (= concerning) would lose."}]},"PHP.2.b06.cadence":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.28: 'the more carefully' kept; the modern sense of 'carefully' (attentively) differs from the KJV sense (with greater eagerness/zeal, σπουδαιοτέρως), so a modern reader takes away a different meaning. R4/P1.","PHP.2.30: 'not regarding his life' kept; modern 'regarding' means 'concerning', which yields a different sense from the KJV 'not sparing/not counting his life'. R4/P1.","PHP.2.26, 2.30: 'of' not rendered per g-of-by; correct here, since neither 'of' marks the agent after a passive verb."],"comments":[]},"PHP.2.b06.clarity":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.30: 'not regarding his life' kept with the reasoning that it is 'still understood in its KJV sense'; a modern reader's default sense of 'regarding' is 'concerning', so the sentence no longer carries the KJV meaning. R4/P1. This single failure excludes the candidate even though 2.28 ('earnestly') and 2.29 ('esteem') are sound.","PHP.2.26, 2.30: 'of' not rendered per g-of-by; correct (genitive and non-agent 'of')."],"comments":[{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"R4: 'earnestly' preserves the KJV sense of 'carefully' here as well as 'eagerly' does."},{"change_id":"c6","verdict":"agree","alternative_text":null,"reason":"R4: 'hold such in esteem' preserves the KJV sense."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R3/G5: ratified g-unto-to applies."},{"change_id":"c7","verdict":"agree","alternative_text":null,"reason":"R3/G5: ratified g-unto-to applies."}]},"PHP.2.b06.mechanical":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"fail"},"scores":null,"weighted":null,"notes":["PHP.2.27 and PHP.2.30: 'unto' kept although the ratified glossary entry g-unto-to requires 'to' in this sense. G5/R3.","PHP.2.28: 'the more carefully' kept; modern sense differs from the KJV sense (σπουδαιοτέρως, 'more eagerly'). R4/P1.","PHP.2.30: 'not regarding his life' kept; modern 'regarding' (= concerning) changes the sense. R4/P1.","PHP.2.26, 2.30: 'of' not rendered per g-of-by; correct (not agent after passive)."],"comments":[]}}},{"reviewer":"reviewer-meaning-auditor","round":1,"id":"rev-1-mw7us98q-7z","summary":"B is the only candidate that removes every shifted-meaning trap in the batch: 'wants' (needs), 'carefully' (earnestly) and 'in reputation' (in esteem). A fails G1 by keeping 'wants', and C and M also keep 'carefully'. B's 'not sparing his life' is faithful but leans toward the Greek, so 'not heeding his life' is offered as a closer alternative.","candidates":{"PHP.2.b06.clarity":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.25: 'ministered to my wants' kept: KJV 'wants' means needs (lacks), as in JDG.19.20 'let all thy wants lie upon me'. A modern reader takes plural 'wants' as desires, so keeping it changes the meaning (R4, P1, G1).","PHP.2.30: 'not regarding his life' kept. Modern readers tend to take 'regarding' as 'concerning', which obscures 'not heeding'. This is noted as a clarity risk, not counted as a G1 failure.","G5: the code warnings on 'of' (2.26 'full of heaviness', 2.30 'work of Christ' and 'lack of service') are false positives. None of these marks an agent after a passive verb, so g-of-by does not apply.","English 1611 lookups (L-mw7uriag-7k/7l/7m/7n) are not installed. The senses were settled from KJV usage via occurrences (L-mw7urkv3-7r, L-mw7urkvd-7t)."],"comments":[{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"Follows ratified g-unto-to. Meaning unchanged (R3, P7)."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"R4: KJV 'carefully' here means with diligence or earnestness (cf. HEB.12.17 'sought it carefully with tears'), not cautiously. 'Earnestly' keeps the KJV sense."},{"change_id":"c6","verdict":"agree","alternative_text":null,"reason":"R4: 'hold in reputation' means hold in esteem (cf. ACT.5.34 'had in reputation'). 'Esteem' is faithful."},{"change_id":"c7","verdict":"agree","alternative_text":null,"reason":"Follows ratified g-unto-to (R3, P7)."}]},"PHP.2.b06.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.2.30: 'not sparing his life' passes, but it leans toward the Greek gloss 'risk' rather than the KJV's attitude sense ('not heeding'). An alternative is offered (P5).","G5: the code warnings on 'of' are false positives. None is a passive agent, as B's notes correctly state."],"comments":[{"change_id":"c1","verdict":"agree","alternative_text":null,"reason":"R4: KJV 'wants' means needs (cf. JDG.19.20). Modern 'wants' reads as desires."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"Follows ratified g-unto-to (R3)."},{"change_id":"c4","verdict":"agree","alternative_text":null,"reason":"R4: removes the shifted sense of 'carefully' (cautiously). 'Eagerly' is acceptable. 'Earnestly' sits slightly closer to the 1611 diligence sense and avoids copying the dataset gloss (R12), but the meaning is preserved."},{"change_id":"c7","verdi 026-11-08T13:02:22.750Z"},"reviews":[{"reviewer":"reviewer-scorer","round":2,"id":"rev-2-mw7ucq7h-10","summary":"A wins: it makes only the changes the rules require (glossary-driven 'brothers', 'concision' to 'mutilation', 'thinketh' to 'thinks') and keeps 'grievous', 'whereof' and 'stock of Israel' as R11 directs. B is accurate on 'concision' but adds an unnecessary 'grievous' to 'burdensome' change (R2, P2), and C's 'the cutting' weakens the KJV sense of mutilation (P1, R3). M is ineligible because it leaves 'brethren' against the glossary entry (G5).","candidates":{"PHP.3.b01.cadence":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":5,"S3":5,"S4":4},"weighted":0.98,"notes":[],"comments":[{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R3/R4: 'concision' is a dead coinage whose only KJV sense here is cutting short/mutilation; 'mutilation' restores that sense and is supported by the cited lookup."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"R2: third-person singular -eth modernized to 'thinks'."}]},"PHP.3.b01.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":3,"S2":5,"S3":5,"S4":4},"weighted":0.82,"notes":["PHP.3.1: 'grievous' is retained by A and C; 'grievous' in modern English still carries the KJV sense of burdensome/oppressive ('grievous burden' is ordinary usage), so B's change is not required by R4."],"comments":[{"change_id":"c2","verdict":"disagree","alternative_text":"is not grievous","reason":"R2/P2 and R11: 'grievous' still conveys burdensome/oppressive in current English, so the KJV wording can stand; this is an optional change and costs minimality without a meaning gain."},{"change_id":"c3","verdict":"agree","alternative_text":null,"reason":"R4: 'concision' now means brevity; 'mutilation' preserves the KJV sense."}]},"PHP.3.b01.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores the KJV's 'lay hold of' sense is not silently turned into the modern 'understand' sense, and it follows the ratified and provisional glossary entries. A fails G1 by keeping 'apprehend' (R4, P1); M fails G5 by leaving 'unto' and 'Brethren' against the glossary.","candidates":{"PHP.3.b03.clarity":{"gates":{"G1":"fail","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":null,"weighted":null,"notes":["PHP.3.12/3.13: 'apprehend'/'apprehended' retained. The dominant modern senses of 'apprehend' are 'understand' and (in its other current sense) 'arrest'; neither is the KJV sense 'lay hold of, grasp'. A reader who takes 'apprehend that' as 'understand that' and 'apprehended of Christ Jesus' as 'understood by' has a different meaning from the KJV, which is exactly what R4 (shifted meaning) and P1 forbid. The candidate's own note concedes the sense is 'grasp/lay hold of', which is the sense R3 requires a modern equivalent to carry ('grasp').","PHP.3.16: 'whereto' -> 'as far as' adds words and the reason states the sense without showing that fewer words could not carry it (R9); the sense is loosened from 'to the point to which we have attained' toward distance.","G2-G4 taken from the check report; no error seen in them."],"comments":[{"change_id":"c1","verdict":"agree","reason":"Glossary g-brethren-brothers covers this sense; 'brothers' is the right one-word form (R3, G5, R9)."},{"change_id":"c2","verdict":"agree","reason":"g-unto-to is ratified and the sense is direction (R3)."},{"change_id":"c3","verdict":"agree","reason":"Two-word 'any thing' is an old spelling of 'anything' (R10)."},{"change_id":"c4","verdict":"agree","reason":"g-unto-to ratified; indirect-object sense (R3)."},{"change_id":"c5","verdict":"agree","reason":"Mechanical plural update (R1)."},{"change_id":"c6","verdict":"alternative","alternative_text":"to the point to which we have already attained","reason":"'as far as' loosens 'whereto ... attained' (the point reached) into distance, and the reason doe iffers","gate_G1_PHP.4.b01.cadence","gate_G1_PHP.4.b01.minimalist","close_scores"]},"eligible":["PHP.4.b01.clarity","PHP.4.b01.mechanical"],"supersedes":null,"at":"2026-11-08T13:16:51.145Z"},"reviews":[{"reviewer":"reviewer-scorer","round":2,"id":"rev-2-mw7uvswc-8z","summary":"A wins: it applies both ratified glossary entries, modernizes 'intreat' and 'alway', and fixes the shifted sense of 'moderation' with 'gentleness', with no optional rewording. C matches A on minimality and meaning but keeps the archaic 'alway', costing it clarity. B is ineligible for first place only on minimality: its 'laboured'/'fellowlabourers' changes are optional under P2. M is ineligible, failing G5 on the ratified 'brethren' and 'unto' entries.","candidates":{"PHP.4.b01.cadence":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":5,"S3":4,"S4":5},"weighted":0.96,"notes":[],"comments":[{"change_id":"c4","verdict":"agree","alternative_text":null,"reason":"R10/R3: 'alway' is obsolete usage; 'always' is required for the modern reader, and the change keeps cadence."},{"change_id":"c5","verdict":"agree","alternative_text":null,"reason":"R4: modern 'moderation' (avoidance of excess) does not carry the KJV sense of mildness/forbearance; 'gentleness' preserves the sense (P1)."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R10: 'intreat' is an obsolete spelling of 'entreat'."},{"change_id":"c6","verdict":"agree","alternative_text":null,"reason":"G5: ratified entry g-unto-to requires 'unto' to become 'to'."}]},"PHP.4.b01.clarity":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":3,"S2":4,"S3":4,"S4":4},"weighted":0.72,"notes":[],"comments":[{"change_id":"c3","verdict":"disagree","alternative_text":"laboured","reason":"P2/R11: 'laboured' is a current standard spelling and is understood; R3/R10 require a change only where the archaic form blocks understanding, so this optional change fails minimality (P2)."},{"change_id":"c4","verdict":"disagree","alternative_text":"fellowlabourers","reason":"P2: same reasoning as c3; splitting and Americanizing a still-current spelling is an unnecessary change (R3/R10)."},{"change_id":"c6","verdict":"agree","alternative_text":null,"reason":"R3/G5: 'alway' is no longer current usage; 'always' is the modern equivalent."},{"change_id":"c7","verdict":"agree","alternative_text":null,"reason":"G5: ratified entry g-unto-to requires 'unto' to become 'to'."}]},"PHP.4.b01.minimalist":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"pass"},"scores":{"S1":5,"S2":4,"S3":5,"S4":5},"weighted":0.94,"notes":[],"comments":[{"change_id":"c4","verdict":"agree","alternative_text":null,"reason":"R4: 'moderation' in modern usage does not convey the KJV mildness/forbearance sense; 'gentleness' carries it (P1)."},{"change_id":"c2","verdict":"agree","alternative_text":null,"reason":"R10: obsolete spelling 'intreat' becomes 'entreat'."},{"change_id":"c5","verdict":"agree","alternative_text":null,"reason":"G5: ratified entry g-unto-to requires 'unto' to become 'to'."}]},"PHP.4.b01.mechanical":{"gates":{"G1":"pass","G2":"pass","G3":"pass","G4":"pass","G5":"fail"},"scores":null,"weighted":null,"notes":["PHP.4.1: 'brethren' left unchanged against ratified entry g-brethren-brothers (G5, R3)","PHP.4.5: 'unto' left unchanged against ratified entry g-unto-to (G5, R3)","PHP.4.3 'intreat' and PHP.4.4 'alway' left in obsolete forms (R10), costing S2","The pretagged 'of' in PHP.4.2 and PHP.4.3 is correctly left unchanged: g-of-by covers only the agent after a passive verb, so no gate failure there"],"comments":[]}}},{"reviewer":"reviewer-meaning-auditor","round":2,"id":"rev-2-mw7uvvve-90","summary":"A and B fail G1 in PHP.4.5: they replace 'moderation' with 'gentleness' using only a Greek gloss as evidence, and the full lexicon entry itself lists 'moderate'. That narrows the KJV sense and breaks P5/R12. C keeps the KJV meaning throughout and is the
